<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GoPrep · Team Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23EF6E45'/><text x='16' y='22' font-family='Poppins,sans-serif' font-size='15' font-weight='700' fill='%23EEEAE1' text-anchor='middle'>GP</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --cream:#EEEAE1; --paper:#F7F5F1; --white:#FFFDFA;
  --orange:#EF6E45; --orange-soft:#FBE4DC; --ink:#2B2C2C; --ink-2:#5A5B5B; --ink-3:#8A8A8A;
  --line:rgba(43,44,44,.13); --line-2:rgba(43,44,44,.07);
  --s-not:#8A8A8A; --s-prog:#EF6E45; --s-block:#C7625B; --s-done:#4C9A8F;
  --p0:#C7383B; --p1:#EF6E45; --p2:#D69A22; --p3:#8A8A8A;
  --ok:#4C9A8F; --warn:#D69A22; --bad:#C7383B;
  --shadow:0 1px 2px rgba(43,44,44,.05),0 4px 14px rgba(43,44,44,.06);
  --shadow-lg:0 8px 40px rgba(43,44,44,.16);
  --r:12px;
}
html,body{height:100%}
body{
  margin:0; font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--orange)}
.hidden{display:none !important}
.spacer{flex:1}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--cream);z-index:100;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:34px 30px;box-shadow:var(--shadow-lg);text-align:center}
.logo{width:52px;height:52px;border-radius:14px;background:var(--orange);color:var(--cream);display:grid;place-items:center;font-weight:700;font-size:19px;margin:0 auto 16px;letter-spacing:.02em}
.login-card h1{font-size:20px;margin-bottom:4px}
.login-card p{color:var(--ink-3);font-size:13px;margin:0 0 22px}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:6px}
.field .hint{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);font-size:11px;margin-top:4px;display:block}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--paper);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);background:var(--white)}
textarea.input{resize:vertical;min-height:76px;line-height:1.55}
.btn{padding:11px 18px;border-radius:10px;font-weight:600;font-size:13.5px;transition:transform .12s,background .15s,box-shadow .15s;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(239,110,69,.3)}
.btn-primary:hover{background:#e35f35}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--cream);color:var(--ink)}
.btn-danger{background:transparent;border:1px solid rgba(199,56,59,.35);color:var(--p0)}
.btn-danger:hover{background:rgba(199,56,59,.08)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-block{width:100%}
.err{color:var(--p0);font-size:12.5px;min-height:18px;margin-top:10px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--white);border-bottom:1px solid var(--line);flex:none}
.bar{display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:15.5px;flex:none}
.brand .logo{width:30px;height:30px;border-radius:9px;font-size:12px;margin:0}
.brand small{display:block;font-weight:400;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;line-height:1}
.tabs{display:flex;gap:3px;background:var(--paper);padding:3px;border-radius:11px;border:1px solid var(--line-2)}
.tab{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--white);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
/* second tier: the views inside a group */
.subtabs{display:flex;gap:7px;padding:11px 20px;flex-wrap:wrap;align-items:center;
         background:var(--paper);border-top:1px solid var(--line-2)}
.subtab{padding:9px 17px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);
        white-space:nowrap;transition:.15s;background:var(--white);border:1px solid var(--line)}
.subtab:hover{color:var(--ink);border-color:var(--orange);transform:translateY(-1px);
              box-shadow:0 2px 8px rgba(43,44,44,.08)}
.subtab.on{color:#fff;background:var(--orange);border-color:var(--orange);
           box-shadow:0 2px 10px rgba(239,110,69,.35)}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.filters{display:flex;gap:8px;padding:0 20px 11px;flex-wrap:wrap;align-items:center}
.filters .input{padding:7px 11px;font-size:12.5px;border-radius:9px;width:auto}
#q{min-width:210px}
.chip-row{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);transition:.15s}
.chip:hover{border-color:var(--ink-3)}
.chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.stats{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--ink-3);margin-left:auto;flex-wrap:wrap}
.stats b{color:var(--ink);font-weight:600}
main{flex:1;overflow:auto;padding:20px}
.wrap{max-width:1240px}
.seg{display:inline-flex;gap:2px;background:var(--paper);padding:3px;border-radius:9px;border:1px solid var(--line-2)}
.seg button{padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button.on{background:var(--white);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* ---------- columns / cards (board) ---------- */
.cols{display:flex;gap:14px;align-items:flex-start;min-height:100%}
.col{flex:1 1 0;min-width:262px;max-width:420px;background:rgba(255,253,250,.62);border:1px solid var(--line-2);border-radius:var(--r);display:flex;flex-direction:column;max-height:100%}
.col.drop{background:var(--orange-soft);border-color:var(--orange);border-style:dashed}
.col-head{padding:12px 14px 9px;display:flex;align-items:center;gap:8px;position:sticky;top:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.col-head h3{font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.count{margin-left:auto;font-size:11.5px;color:var(--ink-3);background:var(--paper);padding:2px 8px;border-radius:20px;font-weight:600}
.col-body{padding:0 10px 12px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.empty{padding:22px 12px;text-align:center;color:var(--ink-3);font-size:12.5px;font-style:italic}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;transition:box-shadow .15s,transform .12s,border-color .15s;position:relative;overflow:hidden}
.card:hover{box-shadow:var(--shadow);border-color:rgba(43,44,44,.22);transform:translateY(-1px)}
.card.dragging{opacity:.4}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc,transparent)}
.card-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.code{font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.04em}
.pri{font-size:10px;font-weight:700;padding:1.5px 6px;border-radius:5px;letter-spacing:.03em;color:#fff}
.card h4{font-size:13.2px;font-weight:500;line-height:1.4;margin-bottom:8px;word-break:break-word}
.card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line-2);font-weight:500}
.tag.phase{background:var(--tc,var(--paper));color:#fff;border-color:transparent}
.tag.goal{background:transparent;color:var(--tc,var(--ink-2));border-color:var(--tc,var(--line))}
.due{font-size:10.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.due.late{color:var(--p0);font-weight:600}
.avs{display:flex;margin-left:auto}
.av{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;border:1.5px solid var(--white);margin-left:-6px;flex:none}
.av:first-child{margin-left:0}

/* ---------- generic panel ---------- */
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.panel-head{padding:13px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-head h3{font-size:14px}
.panel-head .sub{font-size:11.5px;color:var(--ink-3)}
.panel-body{padding:14px 16px}
.section-title{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--ink);
               margin:30px 0 13px;display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:var(--line)}
.section-title:first-child{margin-top:0}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.prog{height:5px;background:var(--paper);border-radius:3px;overflow:hidden;width:110px}
.prog span{display:block;height:100%;background:var(--s-done);border-radius:3px}
.note{font-size:12px;color:var(--ink-3);line-height:1.6}
.pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:rgba(76,154,143,.14);color:var(--ok)}
.pill.warn{background:rgba(214,154,34,.16);color:#A8760F}
.pill.bad{background:rgba(199,56,59,.12);color:var(--bad)}
.pill.mute{background:var(--paper);color:var(--ink-3)}


/* ---------- the company strip: the big picture, one line, on My week ---------- */
.strip{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--white);
       border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;transition:.15s;flex-wrap:wrap}
.strip:hover{border-color:rgba(43,44,44,.24);box-shadow:var(--shadow)}
.strip-ns{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.strip-ns .ga{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.strip-name{font-size:14px;font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-goals{display:flex;gap:5px;flex:none}
.sg{position:relative;display:block;width:13px;height:13px}
.sg i{position:absolute;inset:0;border-radius:4px;opacity:.85}
.sg b{position:absolute;right:-1px;bottom:-1px;width:6px;height:6px;border-radius:50%;
      border:1.5px solid var(--white);background:var(--ink-3)}
.sg b.ok{background:var(--ok)} .sg b.warn{background:var(--warn)} .sg b.bad{background:var(--bad)}
.strip-go{font-size:12px;font-weight:600;color:var(--orange);flex:none}

/* ---------- the handy shelf ---------- */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:9px}
.qcard{display:flex;align-items:center;gap:11px;text-align:left;background:var(--white);
       border:1px solid var(--line);border-radius:11px;padding:12px 14px;transition:.15s;width:100%}
.qcard:hover{border-color:rgba(43,44,44,.24);box-shadow:var(--shadow);transform:translateY(-1px)}
.qi{font-size:19px;line-height:1;flex:none}
.qt{display:flex;flex-direction:column;gap:1px;font-size:13.2px;font-weight:600;min-width:0}
.qt small{font-weight:400;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- fold: detail that should not shout ---------- */
.fold{margin:0 0 12px}
.fold>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);padding:9px 13px;background:var(--white);
              border:1px solid var(--line-2);border-radius:9px;list-style:none;font-weight:500}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"▸ ";color:var(--ink-3)}
.fold[open]>summary::before{content:"▾ "}
.fold>summary:hover{border-color:var(--ink-3)}

/* ---------- phases: closed windows and the rescue ---------- */
.tlp.closed{opacity:.9}
.tlp.closed .tlp-head h3{color:var(--ink-2)}
.rescue{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 16px 12px;padding:11px 14px;
        background:rgba(199,56,59,.05);border:1px solid rgba(199,56,59,.22);border-radius:10px;
        font-size:12.5px;line-height:1.55;color:#8E2A2C}
.rescue>div{flex:1;min-width:220px}
.crit.verdict{color:var(--ink-2);padding-top:10px}
.crit.verdict b{color:var(--ink)}

/* ---------- section titles carry the area colour ---------- */
.section-title .st-dot{width:10px;height:10px;border-radius:3px;background:var(--ac,var(--orange));flex:none}
.section-title .st-sub{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}

/* ---------- goals: tighter grid, obviously expandable ---------- */
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;
           align-items:start;margin-bottom:8px}
.gc-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:13px 15px 9px;
         background:none;font:inherit}
.gc-title{font-size:14.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em;flex:1;color:var(--ink)}
.gc-caret{width:19px;height:19px;border-radius:6px;flex:none;background:var(--paper);
          border:1px solid var(--line);position:relative;transition:.15s}
.gc-caret::after{content:"";position:absolute;left:5px;top:6px;width:6px;height:6px;
  border-right:1.8px solid var(--ink-2);border-bottom:1.8px solid var(--ink-2);
  transform:rotate(45deg);transition:transform .15s}
.goal-card:hover .gc-caret{border-color:var(--gc,var(--orange));background:var(--white)}
.goal-card.open .gc-caret{background:var(--gc,var(--orange));border-color:var(--gc,var(--orange))}
.goal-card.open .gc-caret::after{transform:rotate(-135deg);top:8px;
  border-right-color:#fff;border-bottom-color:#fff}
.gc-body{padding:0 15px}
.gc-tasks{border-top:1px solid var(--line-2);padding:9px 11px 11px;background:var(--paper)}
.gc-more{display:block;width:100%;text-align:left;padding:7px 8px;margin-top:4px;font-size:11.5px;
         font-weight:600;color:var(--orange);border-radius:7px}
.gc-more:hover{background:var(--orange-soft)}

/* ---------- goals ---------- */
.goal-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;position:relative;display:flex;flex-direction:column}
.goal-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc,var(--orange))}
.goal-card .gh{padding:14px 16px 12px 18px}
.goal-card .ga{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gc,var(--orange))}
.goal-card h3{font-size:15.5px;margin:3px 0 6px;line-height:1.3}
.goal-card .gs{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.goal-card .gf{padding:10px 16px 12px 18px;border-top:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto;background:var(--paper)}
.metric{margin:12px 0 0}
.metric .mrow{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--ink-3);margin-bottom:5px}
.metric .mv{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1}
.metric .mt{margin-left:auto;font-size:11.5px}
.mbar{height:6px;background:var(--paper);border-radius:4px;overflow:hidden;position:relative;border:1px solid var(--line-2)}
.mbar span{display:block;height:100%;background:var(--gc,var(--orange));border-radius:4px;transition:width .3s}
.mbar.none{background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 4px,var(--white) 4px,var(--white) 8px)}
.spark{display:flex;align-items:flex-end;gap:2px;height:22px}
.spark i{flex:1;background:var(--gc,var(--orange));opacity:.4;border-radius:1px;min-height:2px}
.spark i:last-child{opacity:1}

/* ---------- gantt ---------- */
/* One CSS grid per row: a sticky label column, then N equal period columns.
   Every row shares --cols, so the header and the bars line up exactly. */
.gantt{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gscroll{overflow-x:auto;overflow-y:visible;max-width:100%}
.gbody{min-width:calc(340px + var(--track-min,600px))}
.grow{display:grid;grid-template-columns:340px minmax(var(--track-min,600px),1fr);border-bottom:1px solid var(--line-2)}
.grow:last-child{border-bottom:none}
.glabel{position:sticky;left:0;z-index:3;background:var(--white);border-right:1px solid var(--line)}
.gtrack{position:relative;display:grid;grid-template-columns:repeat(var(--cols,12),1fr);min-width:0}
.ghead-1,.ghead-2{position:sticky;z-index:4;background:var(--white)}
.ghead-1{top:0}
.ghead-2{top:26px;border-bottom:1px solid var(--line)}
.ghead-1 .glabel,.ghead-2 .glabel{z-index:5;background:var(--white)}
.gmonth{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);
        text-align:center;padding:6px 4px 5px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.gweek{font-size:9.5px;color:var(--ink-3);text-align:center;padding:3px 0 5px;
       border-left:1px solid var(--line-2);font-weight:500;overflow:hidden}
.gweek.mstart{border-left:1px solid var(--line)}
.grow:hover .glabel{background:var(--paper)}
.gcell{border-left:1px solid var(--line-2);height:30px;background:transparent}
.gcell.mstart{border-left:1px solid var(--line)}
.gcell.alt{background:rgba(43,44,44,.017)}
.gname{display:flex;align-items:center;gap:7px;padding:0 12px;height:30px;overflow:hidden;white-space:nowrap}
.ghead-1 .gname,.ghead-2 .gname{height:26px}
.gname .txt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gcaret{width:15px;height:15px;flex:none;display:grid;place-items:center;font-size:8px;color:var(--ink-3);
        border-radius:3px;transition:transform .15s;background:none}
.gcaret:hover{background:var(--line-2);color:var(--ink)}
.gcaret.closed{transform:rotate(-90deg)}
.grow.lvl-goal .gname{font-weight:700;font-size:13px}
.grow.lvl-goal .glabel{background:var(--paper)}
.grow.lvl-goal:hover .glabel{background:var(--cream)}
.grow.lvl-goal .gcell{background:rgba(43,44,44,.026)}
.grow.lvl-ms .gname{padding-left:26px;font-weight:600;font-size:12.3px;color:var(--ink-2)}
.grow.lvl-task .gname{padding-left:44px;font-weight:400;color:var(--ink-2);font-size:12.2px}
.gswatch{width:7px;height:7px;border-radius:2px;flex:none}
.gmeta{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none;padding-left:8px}
.gmeta .pill{font-size:9.5px;padding:1.5px 6px}
.gmeta .count{font-size:10.5px;padding:1.5px 6px}
.gmeta .due{font-size:10px}
.gmeta .count{margin-left:0}
.gmeta .av{width:18px;height:18px;font-size:8px;margin-left:-4px}
.gmeta .av:first-child{margin-left:0}
/* bars */
.gbarwrap{position:absolute;inset:0;pointer-events:none}
.gbar{position:absolute;border-radius:4px;pointer-events:auto}
.gbar.plan{top:8px;height:14px;background:var(--bc,#8A8A8A);opacity:.22}
.gbar.actual{top:11px;height:8px;background:var(--bc,#8A8A8A)}
.grow.lvl-goal .gbar.plan{top:6px;height:18px;opacity:.18}
.grow.lvl-goal .gbar.actual{top:10px;height:10px}
.gbar.actual.late{background:var(--p0)}
.gbar.actual.done{background:var(--s-done)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);z-index:2;pointer-events:none;opacity:.85}
.ghead-2 .gtoday{display:none}
.glegend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:10px 16px;
         border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3);background:var(--paper)}
.glegend i{display:inline-block;width:20px;height:8px;border-radius:3px;vertical-align:middle;margin-right:5px}

/* ---------- planner ---------- */
.pl-bucket.wk{background:var(--white);border:1px solid var(--line-2);border-radius:11px;
              margin-bottom:9px;overflow:hidden}
.pl-bucket.wk>summary{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;
  list-style:none;flex-wrap:wrap}
.pl-bucket.wk>summary::-webkit-details-marker{display:none}
.pl-bucket.wk>summary::after{content:"▾";margin-left:auto;color:var(--ink-3);font-size:11px;
  transition:transform .15s}
.pl-bucket.wk:not([open])>summary::after{transform:rotate(-90deg)}
.pl-bucket.wk>summary:hover{background:var(--paper)}
.pl-bucket.wk>summary h3{font-size:13.5px}
.pl-bucket.wk>.pl-rows{padding:0 12px 12px}
.pl-bucket{margin-bottom:16px}
.pl-head{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.pl-head h3{font-size:13.5px}
.pl-head .when{font-size:11.5px;color:var(--ink-3)}
.pl-rows{display:flex;flex-direction:column;gap:5px}
.pl-row{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--white);border:1px solid var(--line-2);border-radius:9px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.pl-row:hover{border-color:rgba(43,44,44,.2);box-shadow:var(--shadow)}
.pl-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc,transparent)}
.pl-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.pl-row .t small{color:var(--ink-3);font-size:11px;margin-left:6px}
.pl-lane{display:flex;flex-direction:column;gap:6px}
.pl-person{display:flex;align-items:center;gap:8px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
.pl-person h4{font-size:13px}
.pl-person .lc{font-size:11px;color:var(--ink-3);margin-left:auto}

/* ---------- analysis (top-down / bottom-up) ---------- */
.tree-goal{background:var(--white);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;position:relative}
.tree-goal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc,var(--orange))}
.tg-head{padding:13px 16px 12px 19px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;cursor:pointer}
.tg-head:hover{background:var(--paper)}
.tg-head h3{font-size:14.5px}
.tg-body{padding:0 16px 14px 19px}
.tg-ms{border-left:2px solid var(--line-2);padding:9px 0 9px 14px;margin-bottom:3px}
.tg-ms-head{display:flex;align-items:center;gap:8px;font-size:12.8px;font-weight:600;color:var(--ink-2);margin-bottom:6px;flex-wrap:wrap}
.tg-tasks{display:flex;flex-direction:column;gap:3px}
.tg-task{display:flex;align-items:center;gap:8px;font-size:12.3px;color:var(--ink-2);padding:4px 8px;border-radius:6px;cursor:pointer}
.tg-task:hover{background:var(--paper)}
.tg-task .st{width:7px;height:7px;border-radius:50%;flex:none}
.tg-task .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-task.done .tt{color:var(--ink-3);text-decoration:line-through}
/* a destination with nothing scheduled against it reads differently from live work */
.tree-goal.someday{background:repeating-linear-gradient(135deg,var(--white),var(--white) 9px,var(--paper) 9px,var(--paper) 18px);
                   border-style:dashed}
.tree-goal.someday .tg-head{opacity:.92}
.flag{display:flex;align-items:flex-start;gap:9px;padding:11px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;margin-bottom:8px;border:1px solid}
.flag.bad{background:rgba(199,56,59,.05);border-color:rgba(199,56,59,.22);color:#8E2A2C}
.flag.warn{background:rgba(214,154,34,.07);border-color:rgba(214,154,34,.25);color:#7A5609}
.flag.ok{background:rgba(76,154,143,.06);border-color:rgba(76,154,143,.25);color:#2F6E65}
.flag b{font-weight:600}
.flag .fi{font-size:14px;line-height:1.2;flex:none}
.effort-bar{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line-2);background:var(--paper)}
.effort-bar div{display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;min-width:0}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--ink-2)}
.legend-row span{display:flex;align-items:center;gap:6px}
.legend-row i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- big number tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.tile .n{font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.tile .l{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tile.alert .n{color:var(--p0)}
.tile.good .n{color:var(--s-done)}

/* ---------- handbook ---------- */
.doc-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.doc-card:hover{border-color:rgba(43,44,44,.24);box-shadow:var(--shadow);transform:translateY(-1px)}
.doc-card .ic{font-size:21px;line-height:1}
.doc-card h3{font-size:14.5px}
.doc-card p{margin:0;font-size:12.3px;color:var(--ink-3);line-height:1.55}
.doc-card .up{font-size:10.5px;color:var(--ink-3);margin-top:auto;padding-top:8px}
.prose{max-width:760px;font-size:14px;line-height:1.72;color:var(--ink-2)}
.prose h1{font-size:23px;color:var(--ink);margin:28px 0 12px;letter-spacing:-.02em}
.prose h2{font-size:18px;color:var(--ink);margin:30px 0 10px;letter-spacing:-.015em}
.prose h3{font-size:15px;color:var(--ink);margin:22px 0 8px}
.prose h1:first-child,.prose h2:first-child,.prose h3:first-child{margin-top:0}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px}
.prose li{margin-bottom:6px}
.prose strong{color:var(--ink);font-weight:600}
.prose em{font-style:italic}
.prose code{background:var(--paper);padding:1.5px 6px;border-radius:5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid var(--line-2);color:var(--ink)}
.prose pre{background:var(--ink);color:var(--cream);padding:14px 16px;border-radius:10px;overflow-x:auto;margin:0 0 16px;font-size:12.5px;line-height:1.6}
.prose pre code{background:none;border:none;padding:0;color:inherit;font-size:inherit}
.prose blockquote{border-left:3px solid var(--orange);padding:2px 0 2px 15px;margin:0 0 15px;color:var(--ink-3);font-style:italic}
.prose hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.prose table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:13px;display:block;overflow-x:auto}
.prose th,.prose td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.prose th{background:var(--paper);font-weight:600;color:var(--ink);font-size:12px}
.prose a.wl{color:var(--orange);font-weight:500;text-decoration:none;border-bottom:1px solid var(--orange-soft)}
.prose a.wl:hover{border-bottom-color:var(--orange)}
.prose a.wl.dead{color:var(--ink-3);border-bottom-style:dotted;cursor:help}

/* ---------- stack / providers ---------- */
.pv{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc,var(--line))}
.pv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pv-top h3{font-size:14px}
.pv .purpose{font-size:12.2px;color:var(--ink-2);line-height:1.5;margin:0}
.pv-rows{display:flex;flex-direction:column;gap:4px;font-size:12px}
.pv-rows div{display:flex;gap:8px}
.pv-rows dt{color:var(--ink-3);min-width:74px;flex:none}
.pv-rows dd{margin:0;color:var(--ink-2);word-break:break-word}
.pv-foot{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line-2);margin-top:auto}
.secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--ink);color:var(--cream);padding:6px 11px;border-radius:7px;user-select:all;word-break:break-all}
.vault{font-size:12px;color:var(--ink-2);background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:8px 11px;line-height:1.5}

/* a logo you can actually see beats a filename */
.thumb{display:block;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;
       background:repeating-conic-gradient(var(--paper) 0% 25%, var(--white) 0% 50%) 50%/14px 14px;
       min-height:88px;display:grid;place-items:center;padding:10px}
.thumb img{max-width:100%;max-height:120px;object-fit:contain;display:block}
.thumb:hover{border-color:var(--ink-3)}

/* ---------- file browser ---------- */
.fold-tabs{flex-wrap:wrap;margin-bottom:14px;max-width:100%}
.fold-tabs button b{font-weight:600;color:var(--ink-3);margin-left:3px;font-size:11px}
.fold-tabs button.on b{color:var(--orange)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:11px}
.fcard{background:var(--white);border:1px solid var(--line);border-radius:11px;overflow:hidden;
       cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.fcard:hover{border-color:rgba(43,44,44,.26);box-shadow:var(--shadow);transform:translateY(-1px)}
.fthumb{height:118px;display:grid;place-items:center;padding:12px;
        background:repeating-conic-gradient(var(--paper) 0% 25%, var(--white) 0% 50%) 50%/13px 13px}
.fthumb img{max-width:100%;max-height:94px;object-fit:contain;display:block}
.fthumb.glyph{font-size:34px;background:var(--paper)}
.fmeta{padding:9px 11px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fname{font-size:12.6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsub{font-size:10.5px;color:var(--ink-3)}
.factions{display:flex;gap:6px;padding:0 11px 10px;margin-top:auto}
.factions a,.factions button{font-size:11.5px;font-weight:600;color:var(--ink-2);background:var(--paper);
  border:1px solid var(--line-2);border-radius:7px;padding:4px 9px;text-decoration:none;flex:1;text-align:center}
.factions a:hover,.factions button:hover{background:var(--cream);color:var(--ink);border-color:var(--ink-3)}
.lightbox{background:repeating-conic-gradient(var(--paper) 0% 25%, var(--white) 0% 50%) 50%/16px 16px;
          border:1px solid var(--line);border-radius:11px;padding:20px;display:grid;place-items:center;min-height:220px}
.lightbox img{max-width:100%;max-height:52vh;object-fit:contain}
.lightbox.glyph{font-size:56px}

/* ---------- journey graph: vertical, with room ---------- */
.jflow{display:flex;flex-direction:column;align-items:center;max-width:760px;margin:0 auto;padding:4px 0 20px}
.jband{display:flex;align-items:flex-start;gap:16px;width:100%}
.jband-no{flex:none;width:34px;display:grid;place-items:center;padding-top:14px}
.jband-no span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--white);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-3)}
.jband-nodes{flex:1;display:flex;gap:12px;flex-wrap:wrap;min-width:0}
/* the long connector between bands */
.jlink{width:2px;height:44px;background:var(--line);position:relative;margin-left:-1px;
       align-self:flex-start;margin-left:16px}
.jlink::after{content:"";position:absolute;bottom:-1px;left:-5px;border:6px solid transparent;
  border-top-color:var(--line)}
.jnode{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
       cursor:pointer;transition:.15s;position:relative;overflow:hidden;flex:1 1 300px;min-width:260px}
.jnode::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gc,var(--line))}
.jnode:hover{border-color:rgba(43,44,44,.28);box-shadow:var(--shadow);transform:translateY(-1px)}
.jnode.s-problem{border-color:rgba(199,56,59,.4);background:rgba(199,56,59,.035)}
.jnode.s-idea,.jnode.s-planned{background:repeating-linear-gradient(135deg,var(--white),var(--white) 9px,var(--paper) 9px,var(--paper) 18px)}
.jnode-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:3px}
.jname{font-size:14px;font-weight:600;line-height:1.3;flex:1;min-width:0}
.jnode-head .pill{flex:none;font-size:9.5px;padding:1.5px 6px}
.jsub{font-size:11.5px;color:var(--ink-3);margin-bottom:7px}
.jdesc{font-size:12.3px;color:var(--ink-2);line-height:1.55}
.jnote{font-size:11.8px;color:#8E2A2C;background:rgba(199,56,59,.06);border-radius:7px;
       padding:7px 10px;margin-top:9px;line-height:1.5}
.jfoot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;
       padding-top:9px;border-top:1px solid var(--line-2)}
.jfoot .tag{font-size:10px;padding:1.5px 6px}
.jtask{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.02em;margin-left:auto}
.jtask.none{color:var(--ink-3);font-weight:500}

/* ---------- brand marks in prose ---------- */
.cmarks{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}
.cm{display:inline-flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line);
    border-radius:10px;padding:6px 12px 6px 6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.cm i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;flex:none;
      background:var(--c,#8A8A8A);color:#fff;font-style:normal;font-weight:700;font-size:10.5px;letter-spacing:-.02em}
.cm img{width:28px;height:28px;border-radius:7px;object-fit:contain;flex:none;background:var(--paper);
        border:1px solid var(--line-2)}
.cm.has-img{padding-left:5px}

/* ---------- tiles that open what they count ---------- */
.tile.tappable{cursor:pointer;text-align:left;transition:.15s;font:inherit}
.tile.tappable:hover:not(:disabled){border-color:var(--ink-3);transform:translateY(-1px);box-shadow:var(--shadow)}
.tile.tappable:disabled{cursor:default;opacity:.6}
.tile .l{display:flex;align-items:center;gap:6px}
.tile .caret{width:0;height:0;border:4px solid transparent;border-top-color:var(--ink-3);
             margin-top:3px;transition:transform .15s}
.tile.on{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.tile.on .caret{transform:rotate(180deg);border-top-color:var(--orange)}
.tile-open{background:var(--white);border:1px solid var(--line);border-radius:12px;
           padding:12px;margin:-6px 0 16px}

/* ---------- a journey step can show the screen it describes ---------- */
.jshot{border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin:0 0 9px;background:var(--paper)}
.jshot img{display:block;width:100%;height:auto;max-height:150px;object-fit:cover}

/* ---------- ideas board ---------- */
.idea{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
      cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:7px}
.idea:hover{border-color:rgba(43,44,44,.26);box-shadow:var(--shadow);transform:translateY(-1px)}
.idea-top{display:flex;align-items:center;gap:8px}
.idea h3{font-size:14.5px;line-height:1.35}
.idea p{margin:0;font-size:12.6px;color:var(--ink-2);line-height:1.55}
.idea-link{font-size:11.5px;color:var(--orange);font-weight:500;overflow:hidden;
           text-overflow:ellipsis;white-space:nowrap}
.idea-foot{font-size:10.5px;color:var(--ink-3);margin-top:auto;padding-top:6px}
.fsub .lang{color:#A8760F;font-weight:700}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(43,44,44,.45);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:20px;overflow:auto}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:600px;box-shadow:var(--shadow-lg);max-height:calc(100vh - 40px);display:flex;flex-direction:column;margin:auto}
.modal.wide{max-width:900px}
.modal-head{padding:18px 22px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
.modal-head h2{font-size:16.5px}
.modal-head .code{font-size:12px}
.x{margin-left:auto;width:30px;height:30px;border-radius:8px;color:var(--ink-3);font-size:19px;line-height:1;display:grid;place-items:center;flex:none}
.x:hover{background:var(--paper);color:var(--ink)}
.modal-body{padding:18px 22px;overflow-y:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line-2);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.owner-pick{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--paper);transition:.15s}
.opt:hover{border-color:var(--ink-3)}
.opt.on{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.opt .av{margin:0;border-color:transparent;width:19px;height:19px;font-size:8.5px}
.opt input{display:none}
.md-edit{width:100%;min-height:52vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.65}

/* ---------- activity ---------- */
.feed{max-width:720px;display:flex;flex-direction:column;gap:2px}
.ev{display:flex;gap:10px;align-items:baseline;padding:9px 13px;background:var(--white);border:1px solid var(--line-2);border-radius:9px;font-size:12.8px}
.ev .actor{font-weight:600;flex:none}
.ev .act{color:var(--ink-3);flex:none}
.ev .ttl{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .when{margin-left:auto;color:var(--ink-3);font-size:11px;flex:none}
.ev.sec{border-color:rgba(199,56,59,.3);background:rgba(199,56,59,.04)}

/* ---------- timeline (phases) ---------- */
.tl{display:flex;flex-direction:column;gap:14px;max-width:1180px}
.tlp{background:var(--white);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tlp-head{padding:14px 16px;display:flex;align-items:center;gap:12px;border-left:4px solid var(--pc);flex-wrap:wrap}
.tlp-head h3{font-size:15px}
.tlp-head .win{font-size:11.5px;color:var(--ink-3)}
.tlp-head .theme{font-size:12px;color:var(--ink-2);font-style:italic}
.tlp-head .prog{margin-left:auto}
.tlp-body{padding:0 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.crit{padding:0 16px 14px;font-size:11.5px;color:var(--ink-3);line-height:1.6}
.crit b{color:var(--ink-2);font-weight:600}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--cream);padding:11px 20px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;transition:transform .28s cubic-bezier(.2,.9,.3,1);pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--p0)}

@media(max-width:820px){
  main{padding:13px}
  .cols{flex-direction:column}
  .col{max-width:none;width:100%}
  .col-body{max-height:none}
  .bar{padding:10px 13px;gap:10px}
  .filters,.subtabs{padding-left:13px;padding-right:13px}
  .tabs,.subtabs{width:100%;overflow-x:auto}
  .grid2,.grid3{grid-template-columns:1fr}
  .stats{width:100%;margin-left:0}
  /* on a phone the row meta would squeeze the name to two letters,
     so drop it -- the bar colour already says late, and tapping opens the item */
  .grow{grid-template-columns:200px minmax(var(--track-min,600px),1fr)}
  .gbody{min-width:calc(200px + var(--track-min,600px))}
  .gmeta{display:none}
  .strip{gap:10px}
  .strip-go{display:none}
  .quick{grid-template-columns:1fr 1fr;gap:7px}
  .goal-grid{grid-template-columns:1fr}
  .subtab{padding:7px 12px;font-size:13px}

<script>
"use strict";
/* ============================================================
   GoPrep Team Board
   Static page. All data lives in Supabase behind passcode-gated
   SECURITY DEFINER functions -- the key below can only call those.

   Four levels of altitude, and every view is one way of reading them:
     mission  ->  goal  ->  milestone  ->  task
   ============================================================ */
const CFG = {
  url: "https://dpkfwiabwsvrzrihydcc.supabase.co",
  key: "sb_publishable_t52Owu1vWSlxdR6yTEytag_mvC61Ave"
};

const STATUSES = [
  { k:"Not Started", c:"var(--s-not)"   },
  { k:"In Progress", c:"var(--s-prog)"  },
  { k:"Blocked",     c:"var(--s-block)" },
  { k:"Done",        c:"var(--s-done)"  }
];
const STATUS_HEX = { "Not Started":"#8A8A8A", "In Progress":"#EF6E45", "Blocked":"#C7625B", "Done":"#4C9A8F" };
const CATS = ["Bug","Content","Feature","Infra","Marketing","Mobile","Ops","UX"];
const AREAS = ["Company","Product","Content","Marketing","Mobile","Business","Infra","Ops"];
const PRIOS = [
  { k:"P0", c:"var(--p0)", t:"Blocks launch" },
  { k:"P1", c:"var(--p1)", t:"Ship within 4 weeks" },
  { k:"P2", c:"var(--p2)", t:"Next quarter" },
  { k:"P3", c:"var(--p3)", t:"Backlog / icebox" }
];
const PRIO_HEX = { P0:"#C7383B", P1:"#EF6E45", P2:"#D69A22", P3:"#8A8A8A" };
const EFFORTS = [
  { k:"S",  t:"S · under a day" },
  { k:"M",  t:"M · 1-3 days" },
  { k:"L",  t:"L · 4-10 days" },
  { k:"XL", t:"XL · over 2 weeks" }
];
/* rough calendar days an effort size occupies, used to give a task a start
   date when nobody set one -- a Gantt needs a beginning, not just a deadline */
const EFFORT_DAYS = { S:1, M:3, L:10, XL:21 };
const GOAL_STATUS = ["Not started","On track","At risk","Off track","Achieved"];
const GOAL_STATUS_TONE = { "Not started":"mute","On track":"ok","At risk":"warn","Off track":"bad","Achieved":"ok" };
const MS_STATUS = ["Not Started","In Progress","Blocked","Done"];

/* Six destinations, every one a concrete noun. A first-time visitor should be
   able to guess what is behind each label without being told. */
const NAV = [
  { k:"company",  label:"Company",       view:"start" },
  { k:"my",       label:"My week",       view:"my" },
  { k:"where",    label:"Where we are",  view:"where" },
  { k:"timeline", label:"Timeline",      view:"timeline" },
  { k:"marketing",label:"Marketing",     view:"mkt-strategy" },
  { k:"subs",     label:"Subscriptions", view:"stack" },
  { k:"ideas",    label:"Ideas",         view:"ideas" }
];
/* the two destinations deep enough to want a second row */
const SUB_VIEWS = {
  marketing: [
    { k:"mkt-strategy",    label:"Strategy" },
    { k:"mkt-q1",          label:"Q1 plan" },
    { k:"mkt-persona",     label:"Buyer persona" },
    { k:"mkt-competitors", label:"Competitors" },
    { k:"journey-user",    label:"User journey" },
    { k:"journey-value",   label:"Value creation" },
    { k:"files",           label:"Files" }
  ],
  company: [
    { k:"start",    label:"Welcome" },
    { k:"handbook", label:"Handbook" },
    { k:"team",     label:"Team" },
    { k:"activity", label:"Activity" }
  ]
};
/* which destination lights up, including drill-downs with no tab of their own */
const VIEW_HOME = {
  my:"my", tasks:"my",
  where:"where", goal:"where",
  timeline:"timeline",
  "journey-user":"marketing", "journey-value":"marketing",
  ideas:"ideas",
  "mkt-strategy":"marketing", "mkt-q1":"marketing", "mkt-persona":"marketing",
  "mkt-competitors":"marketing", files:"marketing",
  stack:"subs",
  start:"company", handbook:"company", team:"company", activity:"company"
};
/* marketing sub-tabs that are really just a handbook page in disguise */
const MKT_DOC = { "mkt-strategy":"strategy", "mkt-q1":"q1-plan",
                  "mkt-persona":"audience", "mkt-competitors":"competitors" };
/* views that filter tasks, and so want the filter bar */
const TASKY = new Set(["tasks","where","goal","timeline"]);

/* ---- storage that degrades gracefully in sandboxed previews ---- */
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};

let TOKEN = store.get("gp_token") || null;
let ME = store.get("gp_me") || "";
let DATA = { people:[], phases:[], tasks:[], goals:[], milestones:[], docs:[],
             providers:[], assets:[], files:[], journey:[], ideas:[], areas:[],
             metrics:[], activity:[] };
/* the board always opens on Company · Start here, whatever was open last */
let VIEW = "start";
const F = { q:"", person:"", cat:"", phase:"", goal:"", pri:new Set(), mine:false, open:false };
/* per-view local state */
const UI = {
  timelineMode: store.get("gp_tlmode") || "goals",    // goals | phases
  taskGroup:    store.get("gp_tgroup") || "status",   // status | person | goal | area
  fileFolder:   store.get("gp_ffolder") || null,
  weekOpen:     new Set(JSON.parse(store.get("gp_weekopen") || "[]")),
  openTile:     store.get("gp_tile") || null,
  openGoals:    new Set(JSON.parse(store.get("gp_opengoals") || "[]")),
  goal: null,                                          // the goal being drilled into
  ganttScale: store.get("gp_gscale") || "week",   // week | month
  ganttLevel: store.get("gp_glevel") || "ms",     // goal | ms | task
  collapsed: new Set(JSON.parse(store.get("gp_collapsed") || "[]")),
  plannerRange: store.get("gp_prange") || "week", // week | month | quarter
  plannerScope: store.get("gp_pscope") || "me",   // me | team
  plannerBy: store.get("gp_pby") || "date",       // date | person
  doc: null,
  revealed: {}
};

/* ---- tiny helpers ---- */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const byId = (arr) => Object.fromEntries((arr||[]).map(o => [o.id, o]));
const byKey = (arr,k) => Object.fromEntries((arr||[]).map(o => [o[k], o]));
const uniq = a => Array.from(new Set(a));

function toast(msg, bad){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = "toast"; }, 3000);
}

async function rpc(fn, body){
  const r = await fetch(CFG.url + "/rest/v1/rpc/" + fn, {
    method:"POST",
    headers:{ "apikey":CFG.key, "Authorization":"Bearer "+CFG.key, "Content-Type":"application/json" },
    body: JSON.stringify(body || {})
  });
  const txt = await r.text();
  let out = null;
  try { out = txt ? JSON.parse(txt) : null; } catch(e){ out = txt; }
  if (!r.ok){
    const code = (out && (out.message || out.hint)) || ("HTTP " + r.status);
    const err = new Error(code);
    err.raw = out;
    throw err;
  }
  return out;
}

function fail(err, msg){
  if (String(err.message).includes("unauthorized")) return logout("Session expired · sign in again.");
  toast(msg + ": " + err.message, true);
}

/* ---- dates. Everything is a plain yyyy-mm-dd string until it has to be maths ---- */
const DAY = 86400000;
const todayISO = () => new Date().toISOString().slice(0,10);
function d(iso){ return iso ? new Date(iso + "T00:00:00") : null; }
function iso(dt){
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}
function addDays(isoStr, n){ const x = d(isoStr); x.setDate(x.getDate()+n); return iso(x); }
function daysBetween(a, b){ return Math.round((d(b) - d(a)) / DAY); }
function fmtDate(x){
  if (!x) return "";
  return d(x).toLocaleDateString(undefined, { day:"numeric", month:"short" });
}
function fmtDateY(x){
  if (!x) return "";
  return d(x).toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
}
function startOfWeek(isoStr){            // Monday
  const x = d(isoStr); const wd = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - wd); return iso(x);
}
function startOfMonth(isoStr){ const x = d(isoStr); x.setDate(1); return iso(x); }
function startOfQuarter(isoStr){ const x = d(isoStr); x.setMonth(Math.floor(x.getMonth()/3)*3, 1); return iso(x); }
function ago(isoTs){
  const s = (Date.now() - new Date(isoTs).getTime())/1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  if (s < 604800) return Math.floor(s/86400) + "d ago";
  return new Date(isoTs).toLocaleDateString(undefined,{ day:"numeric", month:"short" });
}
function relDue(x){
  if (!x) return "";
  const n = daysBetween(todayISO(), x);
  if (n === 0) return "today";
  if (n === 1) return "tomorrow";
  if (n === -1) return "yesterday";
  if (n < 0) return Math.abs(n) + "d late";
  if (n < 14) return "in " + n + "d";
  return fmtDate(x);
}

/* ---- people ---- */
function personColor(name){
  const p = DATA.people.find(x => x.name === name);
  return p ? p.color : "#8A8A8A";
}
function initials(name){
  const p = DATA.people.find(x => x.name === name);
  if (p && p.initials) return p.initials;
  return String(name || "?").slice(0,2).toUpperCase();
}
function avatar(name, title){
  return '<span class="av" title="' + esc(title || name) + '" style="background:' + personColor(name) + '">' +
    esc(initials(name)) + '</span>';
}

/* ---- task helpers ---- */
function isLate(t){ return t.target_date && t.status !== "Done" && t.target_date < todayISO(); }
function isOpen(t){ return t.status !== "Done"; }
/* a task's planned window: an explicit start, else inferred back from effort */
function taskStart(t){
  if (t.start_date) return t.start_date;
  if (!t.target_date) return null;
  return addDays(t.target_date, -(EFFORT_DAYS[t.effort] || 3));
}
/* Goals we hold ourselves to this year. A mission is the one above them all,
   and a 'someday' goal is a destination with nothing scheduled against it -- neither
   should be nagged about for having no tasks or no metric reading. */
function liveGoals(){ return DATA.goals.filter(g => g.horizon !== "impulse" && g.horizon !== "someday"); }
function somedayGoals(){ return DATA.goals.filter(g => g.horizon === "someday"); }
function goalOf(t){ return t.goal_id ? byId(DATA.goals)[t.goal_id] : null; }
function msOf(t){ return t.milestone_id ? byId(DATA.milestones)[t.milestone_id] : null; }
function tasksOfGoal(g, list){ return (list || DATA.tasks).filter(t => t.goal_id === g.id); }
function tasksOfMs(m, list){ return (list || DATA.tasks).filter(t => t.milestone_id === m.id); }
function msOfGoal(g){ return DATA.milestones.filter(m => m.goal_id === g.id); }
function progress(list){
  if (!list.length) return { done:0, total:0, pct:0 };
  const done = list.filter(t => t.status === "Done").length;
  return { done, total:list.length, pct: Math.round(done/list.length*100) };
}
/* a milestone's window follows the work under it; fall back to its own dates */
function msWindow(m){
  const ts = tasksOfMs(m).filter(t => t.target_date);
  if (ts.length){
    const starts = ts.map(taskStart).filter(Boolean).sort();
    const ends = ts.map(t => t.target_date).sort();
    return { starts: starts[0] || m.starts, ends: ends[ends.length-1] || m.ends };
  }
  return { starts: m.starts, ends: m.ends };
}
function goalWindow(g){
  const ms = msOfGoal(g).map(msWindow).filter(w => w.starts && w.ends);
  if (ms.length){
    const s = ms.map(w => w.starts).sort()[0];
    const e = ms.map(w => w.ends).sort();
    return { starts: g.starts && g.starts < s ? g.starts : s,
             ends: g.ends && g.ends > e[e.length-1] ? g.ends : e[e.length-1] };
  }
  return { starts: g.starts, ends: g.ends };
}

/* ============================================================
   A small markdown renderer. Enough for the handbook: headings,
   lists, tables, code, quotes, rules, and [[wiki links]] between docs.
   Everything is escaped first, so doc bodies can never inject markup.
   ============================================================ */
function md(src){
  if (!src) return "";
  const blocks = [];
  let s = String(src).replace(/\r\n/g, "\n");

  // pull fenced blocks out first so nothing else touches them.
  // ```marks is a small extension: one "Label|#colour" per line, rendered as
  // colour chips. It exists so docs can show brand marks without the renderer
  // having to allow raw HTML through.
  s = s.replace(/```([\w-]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    if (lang === "marks"){
      const chips = code.trim().split("\n").map(line => {
        const [label, colour, img] = line.split("|").map(x => (x||"").trim());
        if (!label) return "";
        /* MyFitnessPal -> MFP, Eat This Much -> ETM, Yazio -> YAZ */
        const caps = (label.match(/[A-Z]/g) || []);
        const initials = (caps.length >= 2 ? caps.join("") : label.replace(/[^A-Za-z]/g,"").slice(0,3))
          .slice(0,3).toUpperCase();
        const badge = img
          ? '<img src="' + esc(img) + '" alt="" loading="lazy">'
          : '<i>' + esc(initials) + '</i>';
        return '<span class="cm' + (img ? ' has-img' : '') + '" style="--c:' +
          esc(colour || "#8A8A8A") + '">' + badge + '<b>' + esc(label) + '</b></span>';
      }).join("");
      blocks.push('<div class="cmarks">' + chips + '</div>');
    } else {
      blocks.push('<pre><code>' + esc(code.replace(/\n$/, "")) + '</code></pre>');
    }
    return "@@BLOCK" + (blocks.length - 1) + "@@";
  });

  const inline = txt => {
    let x = esc(txt);
    x = x.replace(/`([^`]+)`/g, (m,c) => '<code>' + c + '</code>');
    /* non-greedy, so bold can contain italics: **a *b* c** */
    x = x.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
    x = x.replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    // [[Doc title]] -> jump to that handbook doc
    x = x.replace(/\[\[([^\]]+)\]\]/g, (m, name) => {
      const key = docKeyByName(name);
      return key
        ? '<a class="wl" href="#" data-doc="' + esc(key) + '">' + esc(name) + '</a>'
        : '<a class="wl dead" href="#" title="No document called that yet">' + esc(name) + '</a>';
    });
    x = x.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return x;
  };

  const lines = s.split("\n");
  const out = [];
  let i = 0;
  const para = [];
  const flushPara = () => { if (para.length){ out.push('<p>' + inline(para.join(" ")) + '</p>'); para.length = 0; } };

  while (i < lines.length){
    const ln = lines[i];

    if (/^@@BLOCK\d+@@$/.test(ln.trim())){ flushPara(); out.push(ln.trim()); i++; continue; }
    if (!ln.trim()){ flushPara(); i++; continue; }

    let m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))){
      flushPara();
      const lvl = Math.min(m[1].length, 3);
      out.push('<h' + lvl + '>' + inline(m[2]) + '</h' + lvl + '>');
      i++; continue;
    }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(ln)){ flushPara(); out.push('<hr>'); i++; continue; }

    // table: | a | b |  followed by | --- | --- |
    if (/^\s*\|/.test(ln) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flushPara();
      const cells = row => row.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(ln);
      i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])){ body.push(cells(lines[i])); i++; }
      out.push('<table><thead><tr>' + head.map(h => '<th>' + inline(h) + '</th>').join("") +
        '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join("") + '</tr>').join("") +
        '</tbody></table>');
      continue;
    }

    if (/^\s*>\s?/.test(ln)){
      flushPara();
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/, "")); i++; }
      out.push('<blockquote>' + inline(buf.join(" ")) + '</blockquote>');
      continue;
    }

    if (/^\s*([-*+]|\d+\.)\s+/.test(ln)){
      flushPara();
      const ordered = /^\s*\d+\./.test(ln);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])){
        let item = lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        i++;
        // soft-wrapped continuation lines belong to the item above
        while (i < lines.length && lines[i].trim() && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i]) &&
               !/^(#{1,4}\s|\s*\||\s*>|@@BLOCK)/.test(lines[i])){ item += " " + lines[i].trim(); i++; }
        items.push('<li>' + inline(item) + '</li>');
      }
      out.push((ordered ? '<ol>' : '<ul>') + items.join("") + (ordered ? '</ol>' : '</ul>'));
      continue;
    }

    para.push(ln.trim());
    i++;
  }
  flushPara();

  return out.join("\n").replace(/@@BLOCK(\d+)@@/g, (m, n) => blocks[+n]);
}

function docKeyByName(name){
  const n = String(name).trim().toLowerCase();
  const hit = DATA.docs.find(x => x.title.toLowerCase() === n || x.key.toLowerCase() === n);
  return hit ? hit.key : null;
}

/* ============================ filtering ============================ */
function visible(){
  const q = F.q.trim().toLowerCase();
  return DATA.tasks.filter(t => {
    if (F.open && t.status === "Done") return false;
    if (F.person && !(t.owners || []).includes(F.person)) return false;
    if (F.mine && ME && !(t.owners || []).includes(ME)) return false;
    if (F.cat && t.category !== F.cat) return false;
    if (F.phase && t.phase_key !== F.phase) return false;
    if (F.goal && t.goal_id !== F.goal) return false;
    if (F.pri.size && !F.pri.has(t.priority)) return false;
    if (q){
      const g = goalOf(t);
      const hay = [t.code, t.title, t.description, t.notes, t.category, g && g.name, (t.owners||[]).join(" ")]
        .join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ============================ shared bits ============================ */
function card(t){
  const ph = byKey(DATA.phases, "key")[t.phase_key];
  const g  = goalOf(t);
  const pri = PRIOS.find(p => p.k === t.priority);
  const owners = (t.owners || []).map(o => avatar(o)).join("");
  return '<article class="card" draggable="true" data-id="' + t.id + '"' +
    (pri ? ' style="--pc:' + pri.c + '"' : '') + '>' +
      '<div class="card-top">' +
        (t.code ? '<span class="code">' + esc(t.code) + '</span>' : '') +
        (pri ? '<span class="pri" style="background:' + pri.c + '" title="' + esc(pri.t) + '">' + pri.k + '</span>' : '') +
        (t.effort ? '<span class="tag">' + esc(t.effort) + '</span>' : '') +
      '</div>' +
      '<h4>' + esc(t.title) + '</h4>' +
      '<div class="card-meta">' +
        (t.category ? '<span class="tag">' + esc(t.category) + '</span>' : '') +
        (g ? '<span class="tag goal" style="--tc:' + g.color + '" title="Goal">' + esc(g.name) + '</span>'
           : '<span class="tag" style="color:var(--p0);border-color:rgba(199,56,59,.3)" title="Not attached to any goal">no goal</span>') +
        (ph && ph.key !== "icebox" ? '<span class="tag phase" style="--tc:' + ph.color + '">' + esc(ph.name) + '</span>' : '') +
        (owners ? '<div class="avs">' + owners + '</div>' : '') +
        (t.target_date ? '<span class="due' + (isLate(t) ? ' late' : '') + '">' + fmtDate(t.target_date) + '</span>' : '') +
      '</div>' +
    '</article>';
}

function column(title, colour, tasks, dropStatus){
  return '<section class="col"' + (dropStatus ? ' data-drop="' + esc(dropStatus) + '"' : '') + '>' +
    '<div class="col-head"><span class="dot" style="background:' + colour + '"></span>' +
      '<h3>' + esc(title) + '</h3><span class="count">' + tasks.length + '</span></div>' +
    '<div class="col-body">' +
      (tasks.length ? tasks.map(card).join("") : '<div class="empty">Nothing here</div>') +
    '</div></section>';
}

function fmtN(n){ return n == null ? "\u2013" : (Math.round(Number(n)*10)/10).toLocaleString(); }

function metricBlock(g){
  if (!g.metric_name) return '';
  const pts = DATA.metrics.filter(m => m.goal_id === g.id).sort((a,b) => a.on_date < b.on_date ? -1 : 1);
  const cur = g.metric_current, tgt = g.metric_target;
  const has = cur != null;
  /* some metrics are wins when they fall: cost per user, steps before a plan.
     Progress there is how far the gap has closed, not the raw ratio. */
  const base = g.metric_baseline;
  let pct = 0;
  if (has && tgt != null){
    if (g.lower_is_better){
      const from = (base != null && base > tgt) ? base : Math.max(cur, tgt);
      pct = from === tgt ? 100 : Math.round((from - cur) / (from - tgt) * 100);
    } else {
      pct = Math.round(cur / tgt * 100);
    }
    pct = Math.max(0, Math.min(100, pct));
  }
  const max = Math.max.apply(null, pts.map(p => Number(p.value) || 0).concat([1]));
  return '<div class="metric">' +
    '<div class="mrow">' +
      '<span class="mv">' + fmtN(cur) + '</span>' +
      '<span>' + esc(g.metric_unit || "") + '</span>' +
      '<span class="mt">' + (tgt != null
        ? (g.lower_is_better ? "down to " : "target ") + fmtN(tgt) : "no target") + '</span>' +
    '</div>' +
    '<div class="mbar' + (has ? "" : " none") + '"><span style="width:' + pct + '%"></span></div>' +
    '<div class="note" style="margin-top:5px;font-size:11px">' + esc(g.metric_name) +
      (has ? "" : ' · <b style="color:var(--p0)">never measured</b>') + '</div>' +
    (pts.length > 1
      ? '<div class="spark" style="margin-top:8px">' + pts.slice(-12).map(p =>
          '<i style="height:' + Math.max(6, Math.round((Number(p.value)||0)/max*22)) + 'px" title="' +
          esc(p.on_date + ": " + p.value) + '"></i>').join("") + '</div>'
      : '') +
  '</div>';
}

function goalPill(g){
  return '<span class="pill ' + (GOAL_STATUS_TONE[g.status] || "mute") + '">' + esc(g.status) + '</span>';
}

/* ============================================================
   GANTT
   Rows are goal -> milestone -> task, collapsible to any depth.
   Two bars per row: the pale one is the plan, the solid one is
   what has actually happened. Where the solid bar falls short of
   the pale one and today has passed, you are behind.
   ============================================================ */

/* Build the column model once, then every row reuses it. */
function ganttColumns(from, to, scale){
  const cols = [];
  if (scale === "month"){
    let cur = startOfMonth(from);
    while (cur <= to){
      const nxt = iso(new Date(d(cur).getFullYear(), d(cur).getMonth()+1, 1));
      cols.push({ start:cur, end:addDays(nxt,-1),
                  label:d(cur).toLocaleDateString(undefined,{month:"short"}),
                  group:String(d(cur).getFullYear()), groupStart:d(cur).getMonth()===0 });
      cur = nxt;
    }
  } else {
    let cur = startOfWeek(from);
    let seenMonth = null, weekNo = 0;
    while (cur <= to){
      const mk = d(cur).toLocaleDateString(undefined,{month:"short",year:"2-digit"});
      if (mk !== seenMonth){ seenMonth = mk; weekNo = 0; }
      weekNo++;
      cols.push({ start:cur, end:addDays(cur,6), label:String(weekNo),
                  group:mk, groupStart:weekNo===1 });
      cur = addDays(cur, 7);
    }
  }
  return cols;
}

/* Group the columns into the month/year header band above them. */
function ganttGroups(cols){
  const groups = [];
  cols.forEach(c => {
    const last = groups[groups.length-1];
    if (last && last.label === c.group) last.span++;
    else groups.push({ label:c.group, span:1 });
  });
  return groups;
}

function pos(from, to, s, e){
  const total = daysBetween(from, to) + 1;
  const a = Math.max(0, daysBetween(from, s));
  const b = Math.min(total, daysBetween(from, e) + 1);
  if (b <= a) return null;
  return { left: a/total*100, width: (b-a)/total*100 };
}

function bar(from, to, s, e, cls, colour, label){
  const p = pos(from, to, s, e);
  if (!p) return "";
  return '<div class="gbar ' + cls + '" style="left:' + p.left.toFixed(3) + '%;width:' +
    p.width.toFixed(3) + '%;--bc:' + colour + '"' + (label ? ' title="' + esc(label) + '"' : '') + '></div>';
}

function ganttRow(opts){
  const { level, id, name, colour, from, to, plan, actual, meta, caret, kind } = opts;
  const cols = opts.cols;
  const today = todayISO();
  const tp = pos(from, to, today, today);
  return '<div class="grow lvl-' + level + '"' + (id ? ' data-row="' + esc(id) + '"' : '') +
      (kind ? ' data-kind="' + kind + '"' : '') + '>' +
    '<div class="glabel"><div class="gname">' +
      (caret != null
        ? '<button class="gcaret' + (caret ? "" : " closed") + '" data-toggle="' + esc(id) + '">▼</button>'
        : '<span class="gcaret"></span>') +
      (colour ? '<span class="gswatch" style="background:' + colour + '"></span>' : '') +
      '<span class="txt">' + esc(name) + '</span>' +
      (meta ? '<span class="gmeta">' + meta + '</span>' : '') +
    '</div></div>' +
    '<div class="gtrack">' +
      cols.map((c,i) => '<div class="gcell' + (c.groupStart ? " mstart" : "") +
        (i % 2 ? " alt" : "") + '"></div>').join("") +
      '<div class="gbarwrap">' +
        (plan   ? bar(from, to, plan.s,   plan.e,   "plan " + (plan.cls||""),     colour || "#8A8A8A", plan.label)   : "") +
        (actual ? bar(from, to, actual.s, actual.e, "actual " + (actual.cls||""), colour || "#8A8A8A", actual.label) : "") +
        (tp ? '<div class="gtoday" style="left:' + tp.left.toFixed(3) + '%"></div>' : '') +
      '</div>' +
    '</div>' +
  '</div>';
}

/* What has actually happened on a task, as opposed to what was planned. */
function taskActual(t){
  const s = taskStart(t);
  if (!s) return null;
  const today = todayISO();
  if (t.status === "Done"){
    const fin = (t.updated_at || "").slice(0,10) || t.target_date;
    return { s, e: fin < s ? s : fin, cls:"done", label:"Done " + fmtDateY(fin) };
  }
  if (t.status === "Not Started") return null;
  const e = today > s ? today : s;
  const late = isLate(t);
  return { s, e, cls: late ? "late" : "", label: t.status + (late ? " · overdue" : "") + " · running since " + fmtDateY(s) };
}

/* For a goal or milestone the "actual" bar is how much of the window
   the completed work accounts for -- a bar noticeably shorter than the
   today line means the work is behind the calendar. */
function rollupActual(win, pct, allDone){
  if (!win.starts || !win.ends || !pct) return null;
  const span = daysBetween(win.starts, win.ends) + 1;
  const e = addDays(win.starts, Math.max(0, Math.round(span * pct / 100) - 1));
  return { s: win.starts, e, cls: allDone ? "done" : "", label: pct + "% of the work under this is done" };
}

function renderGantt(list){
  const goals = liveGoals().filter(g => !F.goal || g.id === F.goal);
  if (!goals.length) return '<div class="empty">No goals yet. Add one from the Goals view.</div>';

  /* work out the window the chart should cover */
  const dates = [];
  goals.forEach(g => {
    const w = goalWindow(g);
    if (w.starts) dates.push(w.starts);
    if (w.ends) dates.push(w.ends);
    msOfGoal(g).forEach(m => {
      const mw = msWindow(m);
      if (mw.starts) dates.push(mw.starts);
      if (mw.ends) dates.push(mw.ends);
    });
  });
  list.forEach(t => { const s = taskStart(t); if (s) dates.push(s); if (t.target_date) dates.push(t.target_date); });
  dates.push(todayISO());
  dates.sort();
  const scale = UI.ganttScale;
  const pad = scale === "month" ? 20 : 10;
  const from = (scale === "month" ? startOfMonth : startOfWeek)(addDays(dates[0], -pad));
  const to   = addDays(dates[dates.length-1], pad);
  const cols = ganttColumns(from, to, scale);
  const groups = ganttGroups(cols);
  const colW = scale === "month" ? 62 : 27;
  const trackMin = cols.length * colW;

  const showMs   = UI.ganttLevel !== "goal";
  const showTask = UI.ganttLevel === "task";
  const rows = [];

  goals.forEach(g => {
    const gTasks = tasksOfGoal(g, list);
    const gAll   = tasksOfGoal(g);
    const w = goalWindow(g);
    const pr = progress(gAll);
    const open = !UI.collapsed.has(g.id);
    const overdue = gAll.filter(isLate).length;

    rows.push(ganttRow({
      cols, from, to, level:"goal", id:g.id, kind:"goal", name:g.name, colour:g.color,
      caret: showMs ? open : null,
      plan:   w.starts && w.ends ? { s:w.starts, e:w.ends, label:fmtDateY(w.starts) + " → " + fmtDateY(w.ends) } : null,
      actual: rollupActual(w, pr.pct, pr.pct === 100),
      meta: '<span class="pill ' + (GOAL_STATUS_TONE[g.status]||"mute") + '">' + esc(g.status) + '</span>' +
            '<span class="count">' + pr.done + "/" + pr.total + '</span>' +
            (overdue ? '<span class="pill bad">' + overdue + ' late</span>' : '') +
            (!w.starts || !w.ends ? '<span class="pill mute" title="Nothing under this goal has a date">no dates</span>' : '')
    }));
    if (!showMs || !open) return;

    msOfGoal(g).forEach(m => {
      const mTasks = tasksOfMs(m, list);
      const mAll   = tasksOfMs(m);
      const mw = msWindow(m);
      const mOpen = !UI.collapsed.has(m.id);
      const mpr = progress(mAll);
      const mLate = mw.ends && mw.ends < todayISO() && m.status !== "Done";

      rows.push(ganttRow({
        cols, from, to, level:"ms", id:m.id, kind:"milestone", name:m.name, colour:g.color,
        caret: showTask && mAll.length ? mOpen : null,
        plan:   mw.starts && mw.ends ? { s:mw.starts, e:mw.ends, label:fmtDateY(mw.starts) + " → " + fmtDateY(mw.ends) } : null,
        actual: rollupActual(mw, mpr.pct, m.status === "Done"),
        meta: (m.owner ? avatar(m.owner) : "") +
              '<span class="count">' + mpr.done + "/" + mpr.total + '</span>' +
              (mLate ? '<span class="pill bad">late</span>' : '') +
              (!mw.starts || !mw.ends
                ? '<span class="pill mute" title="No task under this milestone has a date, so it cannot be drawn">no dates</span>'
                : '')
      }));
      if (!showTask || !mOpen) return;

      mTasks.forEach(t => {
        const s = taskStart(t);
        rows.push(ganttRow({
          cols, from, to, level:"task", id:t.id, kind:"task", name:t.title, colour:PRIO_HEX[t.priority] || "#8A8A8A",
          plan:   s && t.target_date ? { s, e:t.target_date, label:"Planned " + fmtDateY(s) + " → " + fmtDateY(t.target_date) } : null,
          actual: taskActual(t),
          meta: (t.owners||[]).slice(0,3).map(o => avatar(o)).join("") +
                (t.target_date ? '<span class="due' + (isLate(t) ? " late" : "") + '">' + relDue(t.target_date) + '</span>' : '')
        }));
      });
      /* tasks under this milestone that the filters hid */
      const hidden = mAll.length - mTasks.length;
      if (hidden > 0) rows.push(
        '<div class="grow lvl-task"><div class="glabel"><div class="gname">' +
        '<span class="gcaret"></span><span class="txt" style="color:var(--ink-3);font-style:italic">' +
        hidden + ' more hidden by filters</span></div></div><div class="gtrack"></div></div>');
    });
  });

  /* anything with no goal at all still deserves to be visible */
  const orphans = list.filter(t => !t.goal_id && t.target_date);
  if (orphans.length && !F.goal){
    rows.push(ganttRow({ cols, from, to, level:"goal", id:"__orphans", kind:"orphans",
      name:"Not attached to any goal", colour:"#C7383B",
      caret: showTask ? !UI.collapsed.has("__orphans") : null,
      plan:null, actual:null,
      meta:'<span class="pill bad">' + orphans.length + '</span>' }));
    if (showTask && !UI.collapsed.has("__orphans")){
      orphans.forEach(t => {
        const s = taskStart(t);
        rows.push(ganttRow({
          cols, from, to, level:"task", id:t.id, kind:"task", name:t.title, colour:PRIO_HEX[t.priority] || "#8A8A8A",
          plan: s && t.target_date ? { s, e:t.target_date } : null,
          actual: taskActual(t),
          meta:(t.owners||[]).slice(0,3).map(o => avatar(o)).join("")
        }));
      });
    }
  }

  const head =
    '<div class="grow ghead-1"><div class="glabel"><div class="gname" style="font-weight:600;color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase">' +
      (scale === "month" ? "Year" : "Month") + '</div></div>' +
      '<div class="gtrack" style="grid-template-columns:' +
        groups.map(g => g.span + "fr").join(" ") + '">' +
      groups.map(g => '<div class="gmonth">' + esc(g.label) + '</div>').join("") + '</div></div>' +
