function wireGantt(){
  $$("#gLevel button").forEach(b => b.onclick = () => {
    UI.ganttLevel = b.dataset.l; store.set("gp_glevel", UI.ganttLevel); render();
  });
  $$("#gScale button").forEach(b => b.onclick = () => {
    UI.ganttScale = b.dataset.s; store.set("gp_gscale", UI.ganttScale); render();
  });
  const persist = () => store.set("gp_collapsed", JSON.stringify(Array.from(UI.collapsed)));
  $$(".gcaret[data-toggle]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.toggle;
    UI.collapsed.has(id) ? UI.collapsed.delete(id) : UI.collapsed.add(id);
    persist(); render();
  });
  const gExpand = $("#gExpand"), gCollapse = $("#gCollapse");
  if (gExpand) gExpand.onclick = () => { UI.collapsed.clear(); persist(); render(); };
  if (gCollapse) gCollapse.onclick = () => {
    DATA.goals.forEach(g => UI.collapsed.add(g.id));
    DATA.milestones.forEach(m => UI.collapsed.add(m.id));
    UI.collapsed.add("__orphans");
    persist(); render();
  };
  $$(".grow[data-kind]").forEach(r => {
    const kind = r.dataset.kind, id = r.dataset.row;
    const label = r.querySelector(".glabel");
    if (!label) return;
    label.style.cursor = "pointer";
    label.addEventListener("click", e => {
      if (e.target.closest(".gcaret")) return;
      if (kind === "task") openTask(id);
      else if (kind === "goal" && id !== "__orphans") openGoal(id);
      else if (kind === "milestone") openMilestone(id);
    });
  });
}


/* ============================================================
   PLANNER
   What is due, in a window you choose, for the team or just you.
   Milestones and goals appear alongside tasks -- a deadline is a
   deadline whatever altitude it sits at.
   ============================================================ */
function plannerWindow(){
  const t = todayISO();
  if (UI.plannerRange === "week"){
    const s = startOfWeek(t);
    return { s, e: addDays(s,6), label:"This week", sub: fmtDate(s) + " – " + fmtDateY(addDays(s,6)),
             nextS: addDays(s,7), nextE: addDays(s,13), nextLabel:"Next week" };
  }
  if (UI.plannerRange === "month"){
    const s = startOfMonth(t);
    const e = addDays(iso(new Date(d(s).getFullYear(), d(s).getMonth()+1, 1)), -1);
    const n = addDays(e,1);
    return { s, e, label:"This month", sub: d(s).toLocaleDateString(undefined,{month:"long",year:"numeric"}),
             nextS:n, nextE: addDays(iso(new Date(d(n).getFullYear(), d(n).getMonth()+1, 1)), -1),
             nextLabel:"Next month" };
  }
  const s = startOfQuarter(t);
  const e = addDays(iso(new Date(d(s).getFullYear(), d(s).getMonth()+3, 1)), -1);
  const n = addDays(e,1);
  return { s, e, label:"This quarter", sub:"Q" + (Math.floor(d(s).getMonth()/3)+1) + " " + d(s).getFullYear(),
           nextS:n, nextE: addDays(iso(new Date(d(n).getFullYear(), d(n).getMonth()+3, 1)), -1),
           nextLabel:"Next quarter" };
}

function plannerItem(o){
  const late = o.due && o.due < todayISO() && !o.done;
  return '<div class="pl-row" data-open="' + o.kind + ':' + o.id + '" style="--pc:' + (o.colour||"transparent") + '">' +
    '<span class="pill ' + (o.tone||"mute") + '">' + esc(o.badge) + '</span>' +
    '<span class="t">' + esc(o.title) + (o.sub ? '<small>' + esc(o.sub) + '</small>' : '') + '</span>' +
    '<div class="spacer"></div>' +
    (o.owners||[]).slice(0,3).map(x => avatar(x)).join("") +
    (o.due ? '<span class="due' + (late ? " late" : "") + '" style="margin-left:8px">' + relDue(o.due) + '</span>' : '') +
  '</div>';
}

function plannerItems(list){
  const items = [];
  list.forEach(t => {
    if (!t.target_date || t.status === "Done") return;
    items.push({ kind:"task", id:t.id, title:t.title, sub:t.code, due:t.target_date,
                 owners:t.owners||[], badge:t.priority || "task",
                 tone: t.priority === "P0" ? "bad" : t.priority === "P1" ? "warn" : "mute",
                 colour: PRIO_HEX[t.priority] || "" });
  });
  DATA.milestones.forEach(m => {
    if (!m.ends || m.status === "Done") return;
    const g = byId(DATA.goals)[m.goal_id];
    if (F.goal && m.goal_id !== F.goal) return;
    if (UI.plannerScope === "me" && ME && m.owner !== ME) return;
    items.push({ kind:"milestone", id:m.id, title:m.name, sub: g ? g.name : "", due:m.ends,
                 owners: m.owner ? [m.owner] : [], badge:"milestone", tone:"mute",
                 colour: g ? g.color : "" });
  });
  liveGoals().forEach(g => {
    if (!g.ends || g.status === "Achieved") return;
    if (F.goal && g.id !== F.goal) return;
    if (UI.plannerScope === "me" && ME && g.owner !== ME) return;
    items.push({ kind:"goal", id:g.id, title:g.name, sub:g.area || "", due:g.ends,
                 owners: g.owner ? [g.owner] : [], badge:"goal",
                 tone: GOAL_STATUS_TONE[g.status] || "mute", colour:g.color });
  });
  return items.sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0);
}









/* ============================================================
   FOCUS SPRINT  ·  a timer against one task
   Starting a sprint moves the task to In Progress and opens a
   countdown. The deadline is an absolute timestamp in localStorage,
   so a sprint survives a reload, a re-render and a tab change.
   Nothing is written to the database except that status change:
   logging sprint history would need a table and an RPC.
   ============================================================ */
const SPRINT_DURATIONS = [15, 25, 45, 60];
const SPRINT_DEFAULT   = 25;

let SP = null;          /* { taskId, title, code, endsAt, total, left } */
let spTimer = null;

function spSave(){ SP ? store.set("gp_sprint", JSON.stringify(SP)) : store.del("gp_sprint"); }
function spLoad(){
  try { SP = JSON.parse(store.get("gp_sprint") || "null"); } catch(e){ SP = null; }
  if (SP && !SP.paused && spLeft() <= 0) SP = null;   /* it expired while away */
  spSave(); spPaint(); spSchedule();
}
/* milliseconds left. A paused sprint holds its remainder instead of a deadline. */
function spLeft(){
  if (!SP) return 0;
  return SP.paused ? (SP.left || 0) : Math.max(0, SP.endsAt - Date.now());
}
function spSchedule(){
  clearInterval(spTimer); spTimer = null;
  if (SP && !SP.paused) spTimer = setInterval(spTick, 1000);
}
function mmss(ms){
  const s = Math.max(0, Math.round(ms / 1000));
  return String(Math.floor(s / 60)).padStart(2,"0") + ":" + String(s % 60).padStart(2,"0");
}

async function spStart(taskId, minutes){
  const t = DATA.tasks.find(x => x.id === taskId);
  if (!t) return toast("That task is not on the board any more", true);
  const total = Math.max(1, Math.round(minutes)) * 60000;
  SP = { taskId, title:t.title, code:t.code || "", endsAt: Date.now() + total, total,
         paused:false, left:0, min:false };
  spSave(); spPaint(); spSchedule();
  toast("Sprint started · " + Math.round(minutes) + " min on " + (t.code || t.title));
  /* a sprint means someone is working on it, so say so on the board */
  if (t.status !== "In Progress" && t.status !== "Done"){
    try {
      const row = await rpc("pm_set_status", { p_token:TOKEN, p_id:t.id, p_status:"In Progress", p_actor:ME });
      Object.assign(t, row);
      render();
    } catch(err){ /* the timer is local, so it keeps running either way */ }
  }
}
function spPause(){
  if (!SP || SP.paused) return;
  SP.left = spLeft(); SP.paused = true;
  spSave(); spPaint(); spSchedule();
}
function spResume(){
  if (!SP || !SP.paused) return;
  SP.endsAt = Date.now() + (SP.left || 0); SP.paused = false;
  spSave(); spPaint(); spSchedule();
}
/* the four arrows. Never takes the clock below a second, and keeps the
   "of" total in step so the ring still reads as a fraction of the whole. */
function spAdjust(mins){
  if (!SP) return;
  const cur = spLeft();
  const delta = Math.max(1000 - cur, Math.round(mins * 60000));
  SP.total = Math.max(60000, SP.total + delta);
  if (SP.paused) SP.left = cur + delta; else SP.endsAt = Date.now() + cur + delta;
  spSave(); spPaint();
}
/* full screen by default, the bar when you want the board back */
function spMinimise(on){
  if (!SP) return;
  SP.min = !!on; spSave(); spPaint();
}
function spStop(quiet){
  SP = null; spSave(); spPaint(); spSchedule();
  if (!quiet) toast("Sprint ended");
}

function spTick(){
  if (!SP) return spSchedule();
  if (spLeft() <= 0) return spFinish();
  spPaint();
}
const FS_CIRC = 628.32;          /* 2 pi r, with r = 100 in the ring viewBox */

function spPaint(){
  const bar = $("#sprintBar"), full = $("#sprintFull");
  if (!bar || !full) return;
  if (!SP || !TOKEN){ bar.classList.add("hidden"); full.classList.add("hidden"); return; }
  const left = spLeft();
  const frac = SP.total ? Math.max(0, Math.min(1, left / SP.total)) : 0;
  const mini = !!SP.min;
  bar.classList.toggle("hidden", !mini);
  full.classList.toggle("hidden", mini);

  bar.classList.toggle("paused", !!SP.paused);
  $("#sbRing").style.setProperty("--pct", ((1 - frac) * 100).toFixed(1));
  $("#sbTitle").textContent = SP.title || "Focus";
  $("#sbSub").textContent = (SP.code ? SP.code + " · " : "") +
    (SP.paused ? "paused" : Math.round(SP.total / 60000) + " min sprint");
  $("#sbTime").textContent = mmss(left);
  $("#sbPause").textContent = SP.paused ? "Resume" : "Pause";

  full.classList.toggle("paused", !!SP.paused);
  $("#fsCode").textContent = SP.code || "";
  $("#fsTitle").textContent = SP.title || "Focus";
  $("#fsProg").style.strokeDashoffset = (FS_CIRC * (1 - frac)).toFixed(1);
  $("#fsState").textContent = SP.paused ? "Paused" : "Active";
  $("#fsTime").textContent = mmss(left);
  $("#fsOf").textContent = "of " + mmss(SP.total);
  $("#fsPause").textContent = SP.paused ? "Resume" : "Pause";
}

/* Time is up. Offer the three things anyone actually wants next. */
function spFinish(){
  const t = DATA.tasks.find(x => x.id === SP.taskId);
  const title = SP.title, id = SP.taskId, mins = Math.round(SP.total / 60000);
  spStop(true);
  toast("Sprint finished · " + mins + " min on " + title);
  const close = modal(
    head("Sprint finished") +
    '<div class="modal-body">' +
      '<p class="note" style="margin:0 0 4px">' + mins + ' minutes on</p>' +
      '<h3 style="margin:0 0 14px">' + esc(title) + '</h3>' +
      '<div class="dur-row">' +
        '<button class="dur" data-again="10">Another 10 min</button>' +
        '<button class="dur" data-again="25">Another 25 min</button>' +
      '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      (t ? '<button class="btn btn-ghost" id="spDone">Mark done</button>' : '') +
      '<div class="spacer"></div>' +
      '<button class="btn btn-primary" id="mCancel">Stop here</button>' +
    '</div>');
  $$("[data-again]").forEach(b => b.onclick = () => { close(); spStart(id, Number(b.dataset.again)); });
  const d = $("#spDone");
  if (d) d.onclick = async () => {
    d.disabled = true;
    try {
      const row = await rpc("pm_set_status", { p_token:TOKEN, p_id:id, p_status:"Done", p_actor:ME });
      Object.assign(t, row); close(); render(); toast("Marked done");
    } catch(err){ d.disabled = false; fail(err, "Could not mark it done"); }
  };
}

/* ---- the launcher ---- */
/* Open tasks for whoever is signed in, most urgent first, so both the
   random pick and the list start from the same honest set. */
function spCandidates(){
  const open = DATA.tasks.filter(isOpen);
  const mine = open.filter(t => (t.owners || []).includes(ME));
  const pool = mine.length ? mine : open;
  const rank = { P0:0, P1:1, P2:2, P3:3 };
  return pool.slice().sort((a,b) =>
    (rank[a.priority] ?? 9) - (rank[b.priority] ?? 9) ||
    String(a.target_date || "9999").localeCompare(String(b.target_date || "9999")));
}

function openSprint(taskId){
  if (SP) return toast("A sprint is already running · end it first", true);
  const pool = spCandidates();
  const fixed = taskId ? DATA.tasks.find(x => x.id === taskId) : null;
  if (!fixed && !pool.length) return toast("No open task to sprint on", true);
  let mins = Number(store.get("gp_sprintlen")) || SPRINT_DEFAULT;

  const close = modal(
    head("Start a focus sprint", fixed && fixed.code) +
    '<div class="modal-body">' +
      (fixed
        ? '<div class="field"><label>Task</label><h3 style="margin:2px 0 0">' + esc(fixed.title) + '</h3></div>'
        : '<div class="field"><label for="spTask">Task</label>' +
            '<div style="display:flex;gap:8px">' +
              '<select class="input" id="spTask">' +
                pool.map(t => '<option value="' + esc(t.id) + '">' +
                  esc((t.code ? t.code + " · " : "") + t.title) + '</option>').join("") +
              '</select>' +
              '<button class="btn btn-ghost" id="spRand" style="white-space:nowrap">Surprise me</button>' +
            '</div><span class="hint">' + pool.length + ' open task' + (pool.length === 1 ? "" : "s") +
            (DATA.tasks.filter(isOpen).some(t => (t.owners || []).includes(ME))
              ? ' assigned to you' : ' on the board') + '.</span></div>') +
      '<div class="field"><label>How long</label><div class="dur-row" id="spDur">' +
        SPRINT_DURATIONS.map(d => '<button class="dur' + (d === mins ? " on" : "") +
          '" data-dur="' + d + '">' + d + ' min</button>').join("") +
      '</div>' +
      '<input class="input" id="spCustom" type="number" min="1" max="240" value="' + mins +
        '" style="max-width:130px"><span class="hint">Minutes. Change it to whatever suits.</span></div>' +
    '</div>' +
    foot("Start sprint"));

  const paintDur = () => $$("#spDur .dur").forEach(b =>
    b.classList.toggle("on", Number(b.dataset.dur) === mins));
  $$("#spDur .dur").forEach(b => b.onclick = () => {
    mins = Number(b.dataset.dur); $("#spCustom").value = mins; paintDur();
  });
  $("#spCustom").addEventListener("input", e => { mins = Number(e.target.value) || 0; paintDur(); });

  const r = $("#spRand");
  if (r) r.onclick = () => {
    const pick = pool[Math.floor(Math.random() * pool.length)];
    $("#spTask").value = pick.id;
    toast("Picked " + (pick.code || pick.title));
  };

  $("#mSave").onclick = () => {
    if (!(mins >= 1 && mins <= 240)) return toast("Pick between 1 and 240 minutes", true);
    const id = fixed ? fixed.id : $("#spTask").value;
    store.set("gp_sprintlen", String(mins));
    close();
    spStart(id, mins);
  };
}

/* ============================================================
   THE STACK  ·  providers, subscriptions, who owns what.
   Passwords for low-risk tools are stored and revealed on request,
   and every reveal lands in Activity. Anything that can spend money
   or delete production stores no password at all, by database
   constraint -- it points at the vault instead.
   ============================================================ */
function renderStack(){
  const ps = DATA.providers;
  const cats = {};
  ps.forEach(p => { (cats[p.category || "Other"] = cats[p.category || "Other"] || []).push(p); });
  /* run rate counts what we still pay for; lapsed rows are kept for the record only */
  const live = ps.filter(p => (p.category || "") !== "Lapsed");
  const spend = {};
  live.forEach(p => {
    const a = Number(p.cost_amount) || 0;
    if (!a) return;
    const cur = p.cost_currency || "EUR";
    spend[cur] = (spend[cur] || 0) + (p.cost_cycle === "yearly" ? a/12 : p.cost_cycle === "monthly" ? a : 0);
  });
  const sym = c => ({ EUR:"\u20AC", USD:"$", GBP:"\u00A3" })[c] || (c + " ");
  const monthlyLabel = Object.keys(spend).length
    ? Object.entries(spend).map(([cur,v]) => sym(cur) + Math.round(v)).join(" + ")
    : "\u2014";
  const yearlyLabel = Object.keys(spend).length
    ? Object.entries(spend).map(([cur,v]) => sym(cur) + Math.round(v*12)).join(" + ")
    : "\u2014";
  const crit = ps.filter(p => p.sensitivity === "critical").length;
  const lapsed = ps.length - live.length;
  const soon = ps.filter(p => p.renewal_date && p.renewal_date >= todayISO() &&
                              daysBetween(todayISO(), p.renewal_date) <= 45);

  let out = '<div class="wrap">';
  out += '<div class="panel"><div class="panel-head"><h3>The stack</h3>' +
    '<span class="sub">everything we pay for or depend on</span><div class="spacer"></div>' +
    '<button class="btn btn-ghost btn-sm" id="newProv">+ Provider</button></div></div>';

  out += '<div class="tiles">' +
    '<div class="tile"><div class="n">' + live.length + '</div><div class="l">live providers' +
      (lapsed ? ' · ' + lapsed + ' lapsed' : '') + '</div></div>' +
    '<div class="tile"><div class="n" style="font-size:21px">' + monthlyLabel + '</div>' +
      '<div class="l">per month · ' + yearlyLabel + ' a year</div></div>' +
    '<div class="tile"><div class="n">' + crit + '</div><div class="l">critical accounts</div></div>' +
    '<div class="tile' + (soon.length ? " alert" : "") + '"><div class="n">' + soon.length +
      '</div><div class="l">renewing within 45 days</div></div>' +
  '</div>';

  out += '<div class="flag warn"><span class="fi">◆</span><div>' +
    '<b>Anything marked critical stores no password here · on purpose.</b> ' +
    'One shared team passcode protects this page, and it cannot be revoked for one person. ' +
    'So accounts that can spend money or delete production hold only a pointer to where the ' +
    'real credential lives and how to ask for access. Passwords for low-risk tools are stored, ' +
    'hidden until you click, and every reveal is written to Activity with your name on it.</div></div>';

  /* the things everything else runs on come first */
  const CAT_ORDER = ["Infrastructure","Identity","Tools","Marketing","Research","Lapsed"];
  const ordered = Object.keys(cats).sort((a,b) => {
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b);
  });
  ordered.forEach(cat => {
    out += '<div class="section-title">' + esc(cat) + '</div><div class="grid-auto">';
    cats[cat].forEach(p => {
      const critical = p.sensitivity === "critical";
      const shown = UI.revealed[p.id];
      out += '<div class="pv" style="--sc:' + (critical ? "var(--p0)" : "var(--s-done)") + '">' +
        '<div class="pv-top"><h3>' + esc(p.name) + '</h3>' +
          '<span class="pill ' + (critical ? "bad" : "ok") + '">' + (critical ? "critical" : "low risk") + '</span>' +
          '<div class="spacer"></div>' +
          (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer" class="note">open ↗</a>' : '') +
        '</div>' +
        (p.purpose ? '<p class="purpose">' + esc(p.purpose) + '</p>' : '') +
        '<dl class="pv-rows">' +
          (p.owner ? '<div><dt>Owner</dt><dd>' + esc(p.owner) + '</dd></div>' : '') +
          (p.plan ? '<div><dt>Plan</dt><dd>' + esc(p.plan) + '</dd></div>' : '') +
          (p.cost_amount != null ? '<div><dt>Cost</dt><dd>' + esc(p.cost_currency||"EUR") + ' ' +
            fmtN(p.cost_amount) + ' / ' + esc(p.cost_cycle||"") + '</dd></div>' : '') +
          (p.renewal_date ? '<div><dt>Renews</dt><dd>' + fmtDateY(p.renewal_date) + '</dd></div>' : '') +
          (p.account_email ? '<div><dt>Account</dt><dd>' + esc(p.account_email) + '</dd></div>' : '') +
          (p.username && !critical ? '<div><dt>Username</dt><dd>' + esc(p.username) + '</dd></div>' : '') +
          (p.notes ? '<div><dt>Notes</dt><dd>' + esc(p.notes) + '</dd></div>' : '') +
        '</dl>' +
        (critical
          ? '<div class="vault"><b>No password stored here.</b>' +
            (p.vault_location ? '<br>Lives in: ' + esc(p.vault_location) : '') +
            (p.access_note ? '<br>' + esc(p.access_note) : '') + '</div>'
          : shown
            ? '<div><div class="note" style="margin-bottom:4px">' +
              (shown.username ? esc(shown.username) + " · " : "") + 'click to select</div>' +
              '<div class="secret">' + esc(shown.secret) + '</div></div>'
            : '') +
        '<div class="pv-foot">' +
          (!critical && p.has_secret && !shown
            ? '<button class="btn btn-ghost btn-sm" data-reveal="' + p.id + '">Show password</button>' : '') +
          (!critical && !p.has_secret ? '<span class="note">No password recorded</span>' : '') +
          (shown ? '<button class="btn btn-ghost btn-sm" data-hide="' + p.id + '">Hide</button>' : '') +
          '<div class="spacer"></div>' +
          '<button class="btn btn-ghost btn-sm" data-editprov="' + p.id + '">Edit</button>' +
        '</div>' +
      '</div>';
    });
    out += '</div>';
  });
  if (!ps.length) out += '<div class="empty">Nothing recorded yet.</div>';
  return out + '</div>';
}




function renderPhases(list){
  const today = todayISO();
  /* Where stranded work should go. Not simply "the current phase" -- a window
     that closes next week is no better a home than the one it came from. Take the
     first phase with at least a fortnight of runway left. */
  const target = DATA.phases
    .filter(f => f.ends && daysBetween(today, f.ends) >= 14)
    .sort((a,b) => (a.sort_order||0) - (b.sort_order||0))[0];

  return '<div class="tl">' + DATA.phases.map(ph => {
    const ts = list.filter(t => t.phase_key === ph.key);
    const allTs = DATA.tasks.filter(t => t.phase_key === ph.key);
    const upcoming = ph.ends && ph.ends >= today;
    if (!allTs.length && ph.key !== "icebox" && !upcoming) return "";
    const pr = progress(ts);
    const openN = allTs.filter(isOpen).length;
    const closed = ph.ends && ph.ends < today;
    const live = ph.starts && ph.ends && ph.starts <= today && ph.ends >= today;
    const win = ph.starts ? fmtDate(ph.starts) + " → " + fmtDateY(ph.ends) : "unscheduled";

    return '<section class="tlp' + (closed ? " closed" : "") + '" style="--pc:' + ph.color + '">' +
      '<div class="tlp-head">' +
        '<h3>' + esc(ph.name) + '</h3>' +
        '<span class="win">' + esc(win) + '</span>' +
        (live ? '<span class="pill warn">now</span>' : '') +
        (closed ? '<span class="pill mute">closed</span>' : '') +
        (ph.theme ? '<span class="theme">' + esc(ph.theme) + '</span>' : '') +
        '<div class="spacer"></div>' +
        '<div class="prog" title="' + pr.done + ' of ' + pr.total + ' done"><span style="width:' + pr.pct + '%"></span></div>' +
        '<span class="count">' + pr.done + '/' + pr.total + '</span>' +
        '<button class="btn btn-ghost btn-sm" data-phase="' + esc(ph.key) + '">Edit</button>' +
      '</div>' +
      (closed && openN && target && target.key !== ph.key
        ? '<div class="rescue"><div><b>' + openN + ' task' + (openN===1?"":"s") +
          ' still open in a window that closed ' + relDue(ph.ends) + '.</b> ' +
          'Leaving them here makes every date on this board a little less true.</div>' +
          '<button class="btn btn-primary btn-sm" data-move-from="' + esc(ph.key) +
          '" data-move-to="' + esc(target.key) + '">Move to ' + esc(target.name) + '</button></div>'
        : '') +
      (!allTs.length && upcoming
        ? '<div class="crit" style="padding-top:12px"><i>Nothing planned into this window yet.</i></div>'
        : '') +
      (ph.verdict ? '<div class="crit verdict"><b>Verdict:</b> ' + esc(ph.verdict) + '</div>' : '') +
      (ts.length ? '<div class="tlp-body">' + ts.map(card).join("") + '</div>' : '') +
      (ph.success_criteria ? '<div class="crit"><b>Success:</b> ' + esc(ph.success_criteria) + '</div>' : '') +
    '</section>';
  }).join("") + '</div>';
}

/* ---- shared: the health checks, used on Where we are ---- */
function attentionList(){
  const today = todayISO();
  const all = DATA.tasks, open = all.filter(isOpen);
  const goals = liveGoals();
  const out = [];
  const overdue = open.filter(isLate);
  const silent = goals.filter(g => !tasksOfGoal(g).filter(isOpen).length);
  const noGoal = open.filter(t => !t.goal_id);
  const noDate = open.filter(t => !t.target_date);
  const icebox = all.filter(t => t.phase_key === "icebox" && isOpen(t));
  const unmeasured = goals.filter(g => g.metric_name && g.metric_current == null);

  if (overdue.length) out.push({ tone:"bad",
    text:"<b>" + overdue.length + " open tasks are past their date</b>, the oldest since " +
      fmtDateY(overdue.map(t => t.target_date).sort()[0]) + ".", go:"tasks" });
  if (silent.length) out.push({ tone:"bad",
    text:"<b>" + silent.length + " goal" + (silent.length===1?" has":"s have") + " no open work: " +
      silent.map(g => esc(g.name)).join(", ") + ".</b>", go:"where" });
  if (unmeasured.length) out.push({ tone:"warn",
    text:"<b>" + unmeasured.length + " goals have never been measured.</b> Their health is a guess " +
      "until somebody enters a number.", go:"where" });
  if (icebox.length) out.push({ tone:"warn",
    text:"<b>" + icebox.length + " tasks sit in the Icebox</b> with no date. Give each one a goal " +
      "and a date, or archive it.", go:"tasks" });
  if (noGoal.length) out.push({ tone:"warn",
    text:"<b>" + noGoal.length + " open tasks serve no goal.</b>", go:"tasks" });
  if (noDate.length) out.push({ tone:"warn",
    text:"<b>" + noDate.length + " open tasks have no date</b>, so they appear in no plan.", go:"tasks" });

  const load = DATA.people.filter(p => p.active)
    .map(p => ({ p, n: open.filter(t => (t.owners||[]).includes(p.name)).length }))
    .sort((a,b) => b.n - a.n);
  const total = load.reduce((a,b) => a + b.n, 0) || 1;
  if (load[0] && load[0].n / total > 0.4) out.push({ tone:"bad",
    text:"<b>" + esc(load[0].p.name) + " is on " + load[0].n + " of the " + total +
      " assigned open tasks.</b> Everything queues behind one person.", go:"tasks" });
  return out;
}

/* ============================================================

   ============================================================ */
function renderMyWeek(){
  const today = todayISO();
  const w = plannerWindow();
  const meName = ME || "";
  const justMe = UI.plannerScope === "me" && meName;
  const open = DATA.tasks.filter(isOpen);
  const mine = justMe ? open.filter(t => (t.owners||[]).includes(meName)) : open;
  const items = plannerItems(mine);
  const myOverdue = mine.filter(isLate);
  const myDue = mine.filter(t => t.target_date && t.target_date >= today && t.target_date <= w.e);
  const myProg = mine.filter(t => t.status === "In Progress");
  const undated = mine.filter(t => !t.target_date);

  const buckets = [
    { key:"over", label:"Overdue", sub:"should already have happened", tone:"bad", test:o => o.due < today },
    { key:"now",  label:w.label, sub:w.sub, tone:"warn", test:o => o.due >= today && o.due <= w.e },
    { key:"next", label:w.nextLabel, sub:fmtDate(w.nextS) + " – " + fmtDateY(w.nextE), tone:"mute",
      test:o => o.due >= w.nextS && o.due <= w.nextE }
  ];

  let out = '<div class="wrap">' + companyStrip();

  out += '<div class="panel-head" style="border:none;padding:18px 0 10px">' +
    (justMe ? avatar(meName) : "") +
    '<h2 style="font-size:19px;letter-spacing:-.02em">' +
      (justMe ? esc(meName) + "’s week" : "The team’s week") + '</h2>' +
    '<div class="spacer"></div>' +
    '<div class="seg" id="plRange">' + ["week","month","quarter"].map(k =>
      '<button data-r="' + k + '"' + (UI.plannerRange===k?' class="on"':'') + '>' +
      k[0].toUpperCase()+k.slice(1) + '</button>').join("") + '</div>' +
    '<div class="seg" id="plScope">' +
      '<button data-sc="me"' + (UI.plannerScope==="me"?' class="on"':'') + '>Just me</button>' +
      '<button data-sc="team"' + (UI.plannerScope==="team"?' class="on"':'') + '>Everyone</button>' +
    '</div>' +
  '</div>';

  /* each tile opens the list it counts, and closes again on a second click */
  const tiles = [
    { k:"overdue",  n:myOverdue.length, label:"overdue",  list:myOverdue,
      cls: myOverdue.length ? " alert" : " good" },
    { k:"due",      n:myDue.length,     label:"due " + w.label.toLowerCase(), list:myDue, cls:"" },
    { k:"progress", n:myProg.length,    label:"in progress", list:myProg, cls:"" },
    { k:"open",     n:mine.length,      label:"open in total", list:mine, cls:"" }
  ];
  out += '<div class="tiles">' + tiles.map(t =>
    '<button class="tile tappable' + t.cls + (UI.openTile === t.k ? ' on' : '') +
      '" data-tile="' + t.k + '"' + (t.n ? '' : ' disabled') + '>' +
      '<div class="n">' + t.n + '</div>' +
      '<div class="l">' + esc(t.label) + (t.n ? '<i class="caret"></i>' : '') + '</div>' +
    '</button>').join("") + '</div>';

  const openTile = tiles.find(t => t.k === UI.openTile && t.n);
  if (openTile){
    out += '<div class="tile-open"><div class="pl-rows">' +
      openTile.list.slice(0, 60).map(t => plannerItem({
        kind:"task", id:t.id, title:t.title, sub:t.code, due:t.target_date,
        owners:t.owners||[], badge:t.priority || "task",
        tone: t.priority === "P0" ? "bad" : t.priority === "P1" ? "warn" : "mute",
        colour: PRIO_HEX[t.priority] || "" })).join("") +
      '</div></div>';
  }

  /* collapsed by default: the point of this page is to see the shape of the week
     at a glance, then open the pile you actually want to work through */
  const openSet = UI.weekOpen;
  const body = buckets.map(b => {
    const got = items.filter(b.test);
    if (!got.length) return "";
    const isOpen = openSet.has(b.key);
    return '<details class="pl-bucket wk"' + (isOpen ? " open" : "") + ' data-wk="' + b.key + '">' +
      '<summary><span class="pill ' + b.tone + '">' + got.length + '</span>' +
        '<h3>' + esc(b.label) + '</h3><span class="when">' + esc(b.sub) + '</span></summary>' +
      '<div class="pl-rows">' + got.map(plannerItem).join("") + '</div></details>';
  }).join("");

  out += '<div class="panel"><div class="panel-body">' +
    (body || '<div class="empty">Nothing due in this window. ' +
      (undated.length ? undated.length + ' of your tasks have no date at all.' : 'You are clear.') + '</div>') +
    '</div></div>';

  if (undated.length){
    out += '<details class="fold"><summary>' + undated.length +
      ' of your tasks have no date <span class="note">· they appear in no plan</span></summary>' +
      '<div class="pl-rows" style="margin-top:8px">' + undated.map(t => plannerItem({
        kind:"task", id:t.id, title:t.title, sub:t.code, owners:t.owners||[],
        badge:t.priority||"task", tone:"mute", colour:PRIO_HEX[t.priority]||"" })).join("") +
      '</div></details>';
  }

  out += '<div style="margin:10px 0 4px"><button class="btn btn-ghost btn-sm" data-goview="tasks">' +
    'See every task →</button></div>';

  out += quickAccess();

  const recent = DATA.activity.slice(0,5);
  if (recent.length){
    out += '<div class="section-title">Lately<span class="st-sub">what changed on the board</span></div><div class="feed">' + recent.map(a =>
      '<div class="ev' + (String(a.action).indexOf("revealed") === 0 ? " sec" : "") + '">' +
        '<span class="actor" style="color:' + personColor(a.actor) + '">' + esc(a.actor) + '</span>' +
        '<span class="act">' + esc(a.action) + '</span>' +
        '<span class="ttl">' + esc(a.task_title) + '</span>' +
        '<span class="when">' + ago(a.at) + '</span></div>').join("") + '</div>';
  }
  return out + '</div>';
}

  goals.forEach(g => { (byArea[g.area || "Other"] = byArea[g.area || "Other"] || []).push(g); });
  const order = Object.keys(byArea).sort((a,b) =>
    ((areaMeta[a] || {}).sort_order || 99) - ((areaMeta[b] || {}).sort_order || 99));

  order.forEach(area => {
    const m = areaMeta[area] || { label:area, color:"#8A8A8A" };
    out += '<div class="section-title" style="--ac:' + m.color + '">' +
        '<span class="st-dot"></span>' + esc(m.label) +

        (byArea[area].length === 1 ? ' goal' : ' goals') + '</span></div>' +
      '<div class="goal-grid">' + byArea[area].map(goalCard).join("") + '</div>';
  });

  if (later.length){
    out += '<div class="section-title" style="--ac:#8A8A8A"><span class="st-dot"></span>Someday' +
      '<span class="st-sub">nothing scheduled against these</span></div>' +
      '<div class="goal-grid">' + later.map(goalCard).join("") + '</div>';

  return out + '</div>';
}

function fmtBytes(n){
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return Math.round(n/1024) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}

/* Azure has CORS open for GET, so the page can fetch the bytes and hand the
   browser a real save rather than opening the image in a tab. */
async function downloadFile(f){
  try {
    const r = await fetch(f.url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = f.path.split("/").pop();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast("Saved " + a.download);
  } catch(err){
    window.open(f.url, "_blank", "noopener");
    toast("Opened in a tab · save it from there", true);
  }
}

/* ============================================================
   JOURNEY  ·  the flow as a node graph
   ============================================================ */
const JSTATUS = {
  live:     { label:"live",     tone:"ok"   },
  building: { label:"building", tone:"warn" },
  planned:  { label:"planned",  tone:"mute" },
  idea:     { label:"someday",  tone:"mute" },
  problem:  { label:"problem",  tone:"bad"  }
};

function renderJourney(){
  const which = VIEW === "journey-value" ? "value" : "user";
  const steps = (DATA.journey || []).filter(s => s.journey === which);
  const cols = [];
  steps.forEach(s => {
    (cols[s.step_no] = cols[s.step_no] || []).push(s);
  });

  const head2 = which === "user"
    ? { h:"The user journey", s:"what somebody actually walks through, start to finish" }
    : { h:"Value creation", s:"how one profile turns into more and more of the job being done for them" };

  let out = '<div class="wrap" style="max-width:none">' +
    '<div class="panel-head" style="border:none;padding:0 0 12px">' +
      '<h2 style="font-size:17px">' + esc(head2.h) + '</h2>' +
      '<span class="sub">' + esc(head2.s) + '</span>' +
    '</div>' +
    '<p class="note" style="margin:-4px 0 14px;max-width:720px">Every box is a step. Click one to ' +
    'open the task that would improve it · or to create that task if it does not exist yet. ' +
    'A red box is a step we know is weak.</p>';

  /* Vertical flow: one step per band, branches side by side, a long connector
     between bands. Reads top to bottom with room to breathe, rather than a row
     of squashed columns. */
  out += '<div class="jflow">';
  cols.forEach((group, i) => {
    if (!group) return;
    out += '<div class="jband">' +
      '<div class="jband-no"><span>' + i + '</span></div>' +
      '<div class="jband-nodes">' + group.map(s => {
        const st = JSTATUS[s.status] || JSTATUS.planned;
        const t = s.task_code ? DATA.tasks.find(x => x.code === s.task_code) : null;
        const g = s.goal_key ? DATA.goals.find(x => x.key === s.goal_key) : null;
        return '<div class="jnode s-' + esc(s.status) + '" data-step="' + s.id + '"' +
            (g ? ' style="--gc:' + g.color + '"' : '') + '>' +
          '<div class="jnode-head">' +
            '<span class="jname">' + esc(s.name) + '</span>' +
            '<span class="pill ' + st.tone + '">' + st.label + '</span>' +
          '</div>' +
          (s.subtitle ? '<div class="jsub">' + esc(s.subtitle) + '</div>' : '') +
          (s.shot_url
            ? '<div class="jshot"><img src="' + esc(s.shot_url) + '" alt="" loading="lazy"></div>'
            : '') +
          (s.description ? '<div class="jdesc">' + esc(s.description) + '</div>' : '') +
          (s.note ? '<div class="jnote">' + esc(s.note) + '</div>' : '') +
          '<div class="jfoot">' +
            (g ? '<span class="tag goal" style="--tc:' + g.color + '">' + esc(g.name) + '</span>' : '') +
            (t ? '<span class="jtask">' + esc(t.code) + ' →</span>'
               : '<span class="jtask none">+ add a task</span>') +
          '</div>' +
        '</div>';
      }).join("") + '</div>' +
    '</div>';
    if (i < cols.length - 1 && cols.slice(i+1).some(Boolean)) out += '<div class="jlink"></div>';
  });
  out += '</div>';

  const problems = steps.filter(s => s.status === "problem");
  if (problems.length){
    out += '<div class="section-title">Known weak steps</div>' +
      problems.map(s => '<div class="flag bad"><span class="fi">◆</span><div>' +
        '<b>' + esc(s.name) + '</b> · ' + esc(s.note || s.description || "") +
        (s.task_code ? ' <a href="#" data-step-task="' + esc(s.task_code) + '">' + esc(s.task_code) + ' →</a>' : '') +
        '</div></div>').join("");
  }
  return out + '</div>';
}

  resource:    { label:"Resource",    icon:"📎" },
  tool:        { label:"Tool",        icon:"🛠" },

function renderIdeas(){
  const all = (DATA.ideas || []).slice()
    .sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
  const kinds = Object.keys(IDEA_KIND);

  let out = '<div class="wrap">' +
    '<div class="panel-head" style="border:none;padding:0 0 6px">' +
      '<h2 style="font-size:17px">Ideas</h2>' +

      '<button class="btn btn-primary btn-sm" id="newIdea">+ Post something</button>' +
    '</div>' +

    'assigned or justified. Put the half-thought down so somebody can build on it. ' +
    'When one turns into real work, open it and send it to the board as a task.</p>';

  if (!all.length) return out + '<div class="empty">Nothing on the board yet. Be the first.</div></div>';

  kinds.forEach(k => {

/* ============================================================
   MODALS
   ============================================================ */
function modal(html, opts){
  const wide = opts && opts.wide ? " wide" : "";
  document.body.insertAdjacentHTML("beforeend",
    '<div class="scrim" id="scrim"><div class="modal' + wide + '" role="dialog" aria-modal="true">' + html + '</div></div>');
  const scrim = $("#scrim");
  const close = () => { scrim.remove(); document.removeEventListener("keydown", onEsc); };
  function onEsc(e){ if (e.key === "Escape") close(); }
  scrim.addEventListener("click", e => { if (e.target === scrim) close(); });
  document.addEventListener("keydown", onEsc);
  const x = $("#mClose"), c = $("#mCancel");
  if (x) x.onclick = close;
  if (c) c.onclick = close;
  return close;
}
function selOpts(list, cur, blank){
  return (blank ? '<option value="">' + blank + '</option>' : '') +
    list.map(o => {
      /* id wins where a row has one: goals carry BOTH id and key, and the
         task links to the id. Phases have only a key, which is what they link by. */
      const val = o.id ?? o.k ?? o.key ?? o;
      const lab = o.t ?? o.name ?? o.k ?? o;
      return '<option value="' + esc(val) + '"' + (String(val) === String(cur ?? "") ? " selected" : "") + '>' +
        esc(lab) + '</option>';
    }).join("");
}
function head(title, code, extra){
  return '<div class="modal-head">' + (code ? '<span class="code">' + esc(code) + '</span>' : '') +
    '<h2>' + esc(title) + '</h2>' + (extra || "") +
    '<button class="x" id="mClose" aria-label="Close">×</button></div>';
}
function foot(saveLabel, danger){
  return '<div class="modal-foot">' + (danger || "") + '<div class="spacer"></div>' +
    '<button class="btn btn-ghost" id="mCancel">Cancel</button>' +
    '<button class="btn btn-primary" id="mSave">' + esc(saveLabel) + '</button></div>';
}

const PENCIL = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" ' +
  'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

/* Centre-crop to a square, shrink, and encode as a JPEG data URI. Kept small
   on purpose: every photo travels inside pm_bootstrap on every page load. */
function squareImageDataUrl(file, size){
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type || "")) return reject(new Error("Pick a JPEG, PNG or WebP"));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Could not read that file"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("The browser cannot open that image. HEIC has to be a JPEG first."));
      img.onload = () => {
        const s = Math.min(img.width, img.height);
        const c = document.createElement("canvas");
        c.width = c.height = size;
        c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
        resolve(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

    pBtn.disabled = true; pBtn.classList.add("busy");
    try {
      await savePhoto(p.name, await squareImageDataUrl(f, 256));
      close(); openPerson(p.name);
    } catch(err){
      pBtn.disabled = false; pBtn.classList.remove("busy");
      fileEl.value = "";
      toast(err.message, true);
    }
  };
  if (pDel) pDel.onclick = async () => {
    pDel.disabled = true;
    try { await savePhoto(p.name, ""); close(); openPerson(p.name); }
    catch(err){ pDel.disabled = false; fail(err, "Could not remove it"); }
  };
  $$("[data-ptask]").forEach(el => el.onclick = () => { close(); openTask(el.dataset.ptask); });
  const ps = $("#pSprint");
  if (ps) ps.onclick = () => { close(); openSprint(null); };
}

/* ---------------- profile ----------------
   Role and description only. The name is not editable on purpose:
   pm_tasks.owners is an array of names and pm_goals.owner is a name, so a
   rename would orphan every task and goal that person holds. Changing one
   is a deliberate job for somebody with database access, not a text field. */
function openProfile(name){
  const p = DATA.people.find(x => x.name === name);
  if (!p) return;
  const close = modal(
    head("Edit profile") +
    '<div class="modal-body">' +
      '<div class="field"><label for="prName">Name</label>' +
        '<input class="input" id="prName" value="' + esc(p.name) + '" disabled>' +
        '<span class="hint">Tasks and goals are held by name, so renaming is a database job.</span></div>' +
      '<div class="field"><label for="prRole">Role</label>' +
        '<input class="input" id="prRole" maxlength="80" value="' + esc(p.role || "") +
        '" placeholder="What you do here"></div>' +
      '<div class="field"><label for="prBio">About you</label>' +
        '<textarea class="input" id="prBio" maxlength="600" placeholder="A couple of lines. What you work on, what to come to you for.">' +
        esc(p.bio || "") + '</textarea>' +
        '<span class="hint"><b id="prCount">0</b> of 600 characters.</span></div>' +
    '</div>' +
    foot("Save profile"));

  const bio = $("#prBio"), count = $("#prCount");
  const tick = () => { count.textContent = bio.value.length; };
  bio.addEventListener("input", tick); tick();
  $("#prRole").focus();

  $("#mSave").onclick = async () => {
    $("#mSave").disabled = true;
    try {
      const r = await rpc("pm_save_profile", { p_token:TOKEN, p_name:p.name,
        p_role:$("#prRole").value, p_bio:bio.value, p_actor:ME });
      Object.assign(p, r || {});
      close(); render(); openPerson(p.name);
      toast("Profile saved");
    } catch(err){
      $("#mSave").disabled = false;
      fail(err, "Could not save that");
    }
  };
}

/* ============================================================
   RENDER
   ============================================================ */
const RENDERERS = {
  my:       renderMyWeek,
  where:    renderWhere,
  goal:     renderGoalDetail,
  tasks:    renderTasks,
  timeline: renderTimeline,
  "journey-user":  renderJourney,
  "journey-value": renderJourney,
  ideas:    renderIdeas,
  "mkt-strategy": renderMktDoc,
  "mkt-q1":       renderMktDoc,
  "mkt-persona": renderMktDoc,
  "mkt-competitors": renderMktDoc,
  files:    renderFiles,
  stack:    renderStack,
  start:    renderStart,
  handbook: renderHandbook,
  team:     renderTeam,
  activity: renderActivity
};

function renderStats(list){
  const done = list.filter(t => t.status === "Done").length;
  const prog = list.filter(t => t.status === "In Progress").length;
  const p0   = list.filter(t => t.priority === "P0" && t.status !== "Done").length;
  const late = list.filter(isLate).length;
  $("#stats").innerHTML =
    '<span><b>' + list.length + '</b> shown</span>' +
    '<span><b>' + prog + '</b> in progress</span>' +
    '<span><b>' + done + '</b> done</span>' +
    (p0 ? '<span style="color:var(--p0)"><b>' + p0 + '</b> open P0</span>' : '') +
    (late ? '<span style="color:var(--p0)"><b>' + late + '</b> overdue</span>' : '');
}

function renderNav(){
  const home = VIEW_HOME[VIEW] || "my";
  $("#groups").innerHTML = NAV.map(n =>
    '<button class="tab' + (n.k === home ? " on" : "") + '" data-dest="' + n.k + '">' +
    esc(n.label) + '</button>').join("");
  const subs = SUB_VIEWS[home] || [];
  $("#views").innerHTML = subs.map(v =>
    '<button class="subtab' + (v.k === VIEW ? " on" : "") + '" data-view="' + v.k + '">' +
    esc(v.label) + '</button>').join("");
  $("#views").classList.toggle("hidden", !subs.length);
}

function render(){
  renderNav();
  const list = visible();
  $("#filters").classList.toggle("hidden", !TASKY.has(VIEW));
  const fn = RENDERERS[VIEW] || renderMyWeek;
  $("#main").innerHTML = fn(list);
  if (TASKY.has(VIEW)) renderStats(list);
  wireMain();
}

/* ============================ interaction ============================ */
let dragId = null;

function wireMain(){
  /* cards: click to open, drag to change status */
  $$(".card").forEach(el => {
    el.addEventListener("click", () => openTask(el.dataset.id));
    el.addEventListener("dragstart", e => {
      dragId = el.dataset.id;
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", dragId); } catch(err){}
    });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragId = null; });
  });
  $$(".col[data-drop]").forEach(col => {
    col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave", () => col.classList.remove("drop"));
    col.addEventListener("drop", async e => {
      e.preventDefault();
      col.classList.remove("drop");
      const id = dragId || e.dataTransfer.getData("text/plain");
      const status = col.dataset.drop;
      const t = DATA.tasks.find(x => x.id === id);
      if (!t || t.status === status) return;
      const prev = t.status;
      t.status = status;                 // optimistic
      render();
      try {
        const row = await rpc("pm_set_status", { p_token:TOKEN, p_id:id, p_status:status, p_actor:ME });
        Object.assign(t, row);
        await refresh(true);
      } catch(err){
        t.status = prev; render();
        fail(err, "Could not move that task");
      }
    });
  });

  /* everything that opens something */
  $$("[data-task]").forEach(el => el.onclick = () => openTask(el.dataset.task));
  $$("[data-person]").forEach(el => el.onclick = () => openPerson(el.dataset.person));
  $$("[data-goal]").forEach(el => el.onclick = e => {
    if (e.target.closest("a")) return;
    openGoal(el.dataset.goal);
  });
  $$("[data-ms]").forEach(el => el.onclick = () => openMilestone(el.dataset.ms));
  $$("[data-editdoc]").forEach(el => el.onclick = e => { e.stopPropagation(); openDoc(el.dataset.editdoc); });
  $$("[data-editprov]").forEach(el => el.onclick = () => openProvider(el.dataset.editprov));
  $$(".doc-card[data-doc]").forEach(el => el.onclick = () => { UI.doc = el.dataset.doc; render(); });
  $$("a.wl[data-doc]").forEach(el => el.onclick = e => {
    e.preventDefault();
    const k = el.dataset.doc;
    goView("handbook"); UI.doc = k; render(); $("#main").scrollTop = 0;
  });
  $$("[data-goview]").forEach(el => el.onclick = e => {
    e.preventDefault();
    goView(el.dataset.goview);
  });
  const back = $("#docBack");
  if (back) back.onclick = () => { UI.doc = null; render(); };

  const nd = $("#newDoc");   if (nd) nd.onclick = () => openDoc(null);
  const ng = $("#newGoal");  if (ng) ng.onclick = () => openGoal(null);
  const nm = $("#newMs");    if (nm) nm.onclick = () => openMilestone(null);
  const np = $("#newProv");  if (np) np.onclick = () => openProvider(null);

  /* credentials: reading one is a separate, logged call */
  $$("[data-reveal]").forEach(el => el.onclick = async () => {
    const id = el.dataset.reveal;
    el.disabled = true; el.textContent = "…";
    try {
      const r = await rpc("pm_reveal_secret", { p_token:TOKEN, p_id:id, p_actor:ME });
      if (!r || r.ok !== true){
        toast(r && r.reason === "critical_no_secret"
          ? "No password is stored for a critical account · see where it lives."
          : "No password recorded for that one.", true);
        el.disabled = false; el.textContent = "Show password";
        return;
      }
      UI.revealed[id] = { secret:r.secret, username:r.username };
      await refresh(true);          // so the reveal shows in Activity straight away
      toast("Shown, and written to Activity under your name");
    } catch(err){ el.disabled = false; el.textContent = "Show password"; fail(err, "Could not read that"); }
  });
  $$("[data-hide]").forEach(el => el.onclick = () => { delete UI.revealed[el.dataset.hide]; render(); });

  /* drill down into a goal, as opposed to editing it */
  $$("[data-open-goal]").forEach(el => el.onclick = e => {
    if (e.target.closest("button,[data-goal],[data-ms],[data-task]")) return;
    goView("goal", { goal: el.dataset.openGoal });
  });

  /* the toggles that replaced whole tabs */
  const seg = (sel, attr, key, storeKey) => $$(sel + " button").forEach(b => b.onclick = () => {
    UI[key] = b.dataset[attr]; store.set(storeKey, UI[key]); render();
  });
  seg("#wMode",   "w",  "whereMode",    "gp_wmode");
  seg("#tlMode",  "t",  "timelineMode", "gp_tlmode");
  seg("#tGroup",  "tg", "taskGroup",    "gp_tgroup");
  seg("#plRange", "r",  "plannerRange", "gp_prange");
  seg("#plScope", "sc", "plannerScope", "gp_pscope");

  /* quick-access cards jump straight to a handbook page */
  $$(".qcard[data-doc]").forEach(el => el.onclick = () => {
    UI.doc = el.dataset.doc; goView("handbook"); UI.doc = el.dataset.doc; render();
  });

  /* files: browse, preview, save */
  seg("#fFolder", "ff", "fileFolder", "gp_ffolder");
  $$("[data-file]").forEach(el => el.onclick = e => {
    if (e.target.closest("a,[data-dl]")) return;
    openFile(el.dataset.file);
  });
  $$("[data-dl]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const f = (DATA.files||[]).find(x => x.id === el.dataset.dl);
    if (f) downloadFile(f);
  });
  $$("details.wk").forEach(d => d.addEventListener("toggle", () => {
    d.open ? UI.weekOpen.add(d.dataset.wk) : UI.weekOpen.delete(d.dataset.wk);
    store.set("gp_weekopen", JSON.stringify(Array.from(UI.weekOpen)));
  }));
  $$("[data-step]").forEach(el => el.onclick = () => openStep(el.dataset.step));
  $$("[data-step-task]").forEach(el => el.onclick = e => {
    e.preventDefault();
    const t = DATA.tasks.find(x => x.code === el.dataset.stepTask);
    if (t) openTask(t.id);
  });

  $$("[data-editasset]").forEach(el => el.onclick = () => openAsset(el.dataset.editasset));
  const na = $("#newAsset"); if (na) na.onclick = () => openAsset(null);

  /* the four counters open the list they count */
  $$("[data-tile]").forEach(el => el.onclick = () => {
    UI.openTile = UI.openTile === el.dataset.tile ? null : el.dataset.tile;
    store.set("gp_tile", UI.openTile || "");
    render();
  });
  /* a goal card opens in place to show its tasks */
  $$("[data-toggle-goal]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const id = el.dataset.toggleGoal;
    UI.openGoals.has(id) ? UI.openGoals.delete(id) : UI.openGoals.add(id);
    store.set("gp_opengoals", JSON.stringify(Array.from(UI.openGoals)));
    render();
  });

  $$("[data-editidea]").forEach(el => el.onclick = () => openIdea(el.dataset.editidea));
  const ni = $("#newIdea"); if (ni) ni.onclick = () => openIdea(null);

  const nth = $("#newTaskHere");
  if (nth) nth.onclick = () => openTask(null, { goal: UI.goal });

  /* phases: edit the window, or rescue what is stranded in a closed one */
  $$("[data-phase]").forEach(el => el.onclick = e => { e.stopPropagation(); openPhase(el.dataset.phase); });
  $$("[data-move-from]").forEach(el => el.onclick = async () => {
    const from = byKey(DATA.phases,"key")[el.dataset.moveFrom];
    const to   = byKey(DATA.phases,"key")[el.dataset.moveTo];
    const n = DATA.tasks.filter(t => t.phase_key === from.key && isOpen(t)).length;
    if (!confirm("Move " + n + " open task" + (n===1?"":"s") + " from “" + from.name +
                 "” into “" + to.name + "”?\n\nTheir dates are left alone · change those " +
                 "individually, so the new plan is a decision rather than a shuffle.")) return;
    el.disabled = true;
    try {
      const r = await rpc("pm_move_phase_tasks", { p_token:TOKEN, p_from:from.key, p_to:to.key,
                                                   p_shift_days:0, p_actor:ME });
      await refresh(true);
      toast("Moved " + (r && r.moved != null ? r.moved : n) + " into " + to.name);
    } catch(err){ el.disabled = false; fail(err, "Could not move those"); }
  });

  if (VIEW === "timeline" && UI.timelineMode === "goals") wireGantt();
  $$("[data-open]").forEach(el => el.onclick = () => {
    const [kind, id] = el.dataset.open.split(":");
    if (kind === "task") openTask(id);
    else if (kind === "goal") goView("goal", { goal:id });
    else if (kind === "milestone") openMilestone(id);
  });
}

function goView(view, opts){
  VIEW = view;
  if (!opts || !opts.keepGoal) UI.goal = (view === "goal" && opts && opts.goal) ? opts.goal : null;
  if (view === "goal" && opts && opts.goal) UI.goal = opts.goal;
  if (view !== "handbook") UI.doc = null;
  store.set("gp_view", VIEW);
  render();
  $("#main").scrollTop = 0;
}

/* ---------------- data ---------------- */
async function refresh(quiet){
  try {
    const x = await rpc("pm_bootstrap", { p_token:TOKEN });
    DATA = {
      people:x.people||[], phases:x.phases||[], tasks:x.tasks||[],
      goals:x.goals||[], milestones:x.milestones||[], docs:x.docs||[],
      providers:x.providers||[], assets:x.assets||[],
      files:x.files||[], journey:x.journey||[],
      ideas:x.ideas||[], areas:x.areas||[],
      metrics:x.metrics||[], activity:x.activity||[]
    };
    buildFilters();
    populateWho();
    render();
    if (!quiet) toast("Up to date");
  } catch(err){
    if (String(err.message).includes("unauthorized")) return logout("Session expired · sign in again.");
    toast("Could not load: " + err.message, true);
  }
}

function buildFilters(){
  const keep = (id, val) => { const el = $(id); if (el) el.value = val; };
  $("#fPerson").innerHTML = '<option value="">All people</option>' +
    DATA.people.filter(p => p.active).map(p => '<option>' + esc(p.name) + '</option>').join("");
  $("#fCat").innerHTML = '<option value="">All areas</option>' +
    CATS.map(c => '<option>' + esc(c) + '</option>').join("");
  $("#fPhase").innerHTML = '<option value="">All phases</option>' +
    DATA.phases.map(p => '<option value="' + esc(p.key) + '">' + esc(p.name) + '</option>').join("");
  $("#fGoal").innerHTML = '<option value="">All goals</option>' +
    DATA.goals.filter(g => g.horizon !== "impulse")
      .map(g => '<option value="' + esc(g.id) + '">' + esc(g.name) + '</option>').join("");
  keep("#fPerson", F.person); keep("#fCat", F.cat); keep("#fPhase", F.phase); keep("#fGoal", F.goal);
  if (!$("#fPri").children.length){
    $("#fPri").innerHTML = PRIOS.map(p =>
      '<button class="chip" data-pri="' + p.k + '" title="' + esc(p.t) + '">' + p.k + '</button>').join("");
    $$("#fPri .chip").forEach(b => b.onclick = () => {
      const k = b.dataset.pri;
      F.pri.has(k) ? F.pri.delete(k) : F.pri.add(k);
      b.classList.toggle("on");
      render();
    });
  }
}

/* ---------------- session ---------------- */
function logout(msg){
  TOKEN = null; store.del("gp_token");
  spStop(true);
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  $("#loginErr").textContent = msg || "";
  $("#pass").value = "";
}
function startApp(){
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  spLoad();
  refresh(true);
}
/* The roster comes from pm_people, so adding a teammate is a database change only. */
function populateWho(){
  const names = DATA.people.filter(p => p.active).map(p => p.name);
  if (!names.length) return;
  if (!names.includes(ME)) ME = names[0];
  store.set("gp_me", ME);
  $("#whoSel").innerHTML = names.map(n =>
    '<option' + (n === ME ? " selected" : "") + '>' + esc(n) + '</option>').join("");
  paintWho();
}
function paintWho(){
  const a = $("#whoAv");
  a.textContent = initials(ME);
  a.style.background = personColor(ME);
  a.style.borderColor = "transparent";
}

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#loginBtn");
  btn.disabled = true; btn.textContent = "Checking…";
  $("#loginErr").textContent = "";
  try {
    const r = await rpc("pm_login", { p_passcode: $("#pass").value });
    if (!r || r.ok !== true){
      const reason = r && r.reason;
      if (reason === "too_many_attempts"){
        const mins = Math.max(1, Math.ceil((r.retry_after_seconds || 900) / 60));
        $("#loginErr").textContent =
          "Too many wrong attempts. Try again in about " + mins + " minute" + (mins === 1 ? "" : "s") + ".";
      } else {
        const left = r && r.attempts_left;
        $("#loginErr").textContent = "That passcode is not right." +
          (left != null ? " " + left + " attempt" + (left === 1 ? "" : "s") + " left before a 15-minute lockout." : "");
      }
      return;
    }
    TOKEN = r.token;
    store.set("gp_token", TOKEN);
    startApp();
  } catch(err){
    $("#loginErr").textContent = "Could not sign in: " + err.message;
  } finally {
    btn.disabled = false; btn.textContent = "Open the board";
  }
});

/* ---------------- wiring ---------------- */
$("#groups").addEventListener("click", e => {
  const b = e.target.closest("[data-dest]"); if (!b) return;
  const n = NAV.find(x => x.k === b.dataset.dest);
  if (n) goView(n.view);
});
$("#views").addEventListener("click", e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  goView(b.dataset.view);
});
$("#q").addEventListener("input", e => { F.q = e.target.value; render(); });
$("#fPerson").addEventListener("change", e => { F.person = e.target.value; render(); });
$("#fCat").addEventListener("change", e => { F.cat = e.target.value; render(); });
$("#fPhase").addEventListener("change", e => { F.phase = e.target.value; render(); });
$("#fGoal").addEventListener("change", e => { F.goal = e.target.value; render(); });
$("#fMine").addEventListener("click", e => { F.mine = !F.mine; e.target.classList.toggle("on"); render(); });
$("#fOpen").addEventListener("click", e => { F.open = !F.open; e.target.classList.toggle("on"); render(); });
$("#whoSel").addEventListener("change", e => {
  ME = e.target.value;
  store.set("gp_me", ME);
  paintWho();
  render();
});
$("#refreshBtn").addEventListener("click", () => refresh());
$("#focusBtn").addEventListener("click", () => SP ? spPaint() : openSprint(null));
$("#sbPause").addEventListener("click", () => SP && SP.paused ? spResume() : spPause());
$("#sbOpen").addEventListener("click", () => spMinimise(false));
$("#fsMin").addEventListener("click", () => spMinimise(true));
$("#fsEnd").addEventListener("click", () => spStop());
$("#fsPause").addEventListener("click", () => SP && SP.paused ? spResume() : spPause());
$("#fsOpen").addEventListener("click", () => { if (SP) openTask(SP.taskId); });
$("#fsM1").addEventListener("click", () => spAdjust(-1));
$("#fsM5").addEventListener("click", () => spAdjust(-5));
$("#fsP1").addEventListener("click", () => spAdjust(1));
$("#fsP5").addEventListener("click", () => spAdjust(5));
$("#sbStop").addEventListener("click", () => spStop());
/* "+ New" makes whatever the current view is about */
$("#newBtn").addEventListener("click", () => {
  if (VIEW === "where") openGoal(null);
  else if (VIEW === "handbook") openDoc(null);
  else if (VIEW === "stack") openProvider(null);
  else if (VIEW === "files") openAsset(null);
  else if (VIEW === "ideas") openIdea(null);
  else openTask(null);
});

/* a view stored before the nav was reorganised should not strand anyone */
if (!RENDERERS[VIEW]) VIEW = "my";

if (TOKEN) startApp();
</script>
